<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Studio Clean Background -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="50%" stop-color="#0f1b2d" />
      <stop offset="100%" stop-color="#070d18" />
    </linearGradient>

    <!-- White Cable Sheath Gradient (Apple / Samsung style matte white PVC) -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Metallic Connector Tip Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- White Connector Housing Gradient -->
    <linearGradient id="plugBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows for 3D realism -->
    <filter id="cableShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#studioBg)" />
  <circle cx="300" cy="225" r="190" fill="url(#softGlow)" />

  <!-- Subtle grid scale -->
  <path d="M 0 112.5 L 600 112.5 M 0 225 L 600 225 M 0 337.5 L 600 337.5" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 150 0 L 150 450 M 300 0 L 300 450 M 450 0 L 450 450" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Natural Loosely Coiled Phone USB Cable -->
  <g filter="url(#cableShadow)">
    <!-- Cable Shadow Path for grounding -->
    <path d="M 160 300 
             C 140 240, 160 160, 240 140 
             C 320 120, 390 140, 420 200 
             C 450 260, 420 330, 340 345 
             C 260 360, 210 320, 205 270 
             C 200 220, 240 180, 290 180 
             C 340 180, 375 220, 380 260 
             C 385 300, 370 330, 450 310" 
          fill="none" stroke="#000000" stroke-width="14" stroke-opacity="0.4" stroke-linecap="round" />

    <!-- Cable Outer Core Path -->
    <path d="M 160 300 
             C 140 240, 160 160, 240 140 
             C 320 120, 390 140, 420 200 
             C 450 260, 420 330, 340 345 
             C 260 360, 210 320, 205 270 
             C 200 220, 240 180, 290 180 
             C 340 180, 375 220, 380 260 
             C 385 300, 370 330, 450 310" 
          fill="none" stroke="url(#cableGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- High-gloss specular highlight on cable -->
    <path d="M 160 299 
             C 140 239, 160 159, 240 139 
             C 320 119, 390 139, 420 199 
             C 450 259, 420 329, 340 344 
             C 260 359, 210 319, 205 269 
             C 200 219, 240 179, 290 179 
             C 340 179, 375 219, 380 259 
             C 385 299, 370 329, 450 309" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round" />
  </g>

  <!-- ================= LEFT: STANDARD USB-A PLUG (Charger / Power Bank Side) ================= -->
  <g transform="translate(100, 280) rotate(-18)" filter="url(#cableShadow)">
    <!-- Flexible Strain Relief Neck -->
    <rect x="52" y="11" width="16" height="10" rx="3" fill="#cbd5e1" />
    <line x1="56" y1="11" x2="56" y2="21" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="61" y1="11" x2="61" y2="21" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Standard White USB Plug Body -->
    <rect x="18" y="6" width="36" height="20" rx="4" fill="url(#plugBodyGrad)" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="20" y="8" width="32" height="6" rx="2" fill="#ffffff" fill-opacity="0.8" />

    <!-- Metal USB Shield Tip -->
    <rect x="-2" y="8" width="20" height="16" rx="2" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1" />
    <!-- Standard USB rectangle window cuts -->
    <rect x="3" y="11" width="5" height="4" rx="0.5" fill="#1e293b" />
    <rect x="3" y="17" width="5" height="4" rx="0.5" fill="#1e293b" />
    <!-- Center white plastic tongue -->
    <rect x="-1" y="12" width="15" height="3" fill="#f8fafc" />

    <!-- Label -->
    <text x="25" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">USB-A</text>
  </g>

  <!-- ================= RIGHT: SMALL STANDARD PHONE USB-C PLUG (Device / Phone Side) ================= -->
  <g transform="translate(450, 310) rotate(15)" filter="url(#cableShadow)">
    <!-- Flexible Strain Relief Neck -->
    <rect x="-18" y="12" width="18" height="8" rx="2.5" fill="#cbd5e1" />
    <line x1="-13" y1="12" x2="-13" y2="20" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="-7" y1="12" x2="-7" y2="20" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Compact White Phone Connector Body -->
    <rect x="0" y="8" width="28" height="16" rx="5" fill="url(#plugBodyGrad)" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="2" y="10" width="24" height="4" rx="2" fill="#ffffff" fill-opacity="0.8" />

    <!-- Oval Metal Type-C Phone Plug Shell -->
    <rect x="28" y="10" width="16" height="12" rx="4" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1" />
    <!-- Center Type-C oval port slot -->
    <ellipse cx="36" cy="16" rx="5" ry="2" fill="#1e293b" />

    <!-- Label -->
    <text x="22" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" text-anchor="middle">USB-C</text>
  </g>

  <!-- Natural Badge Header (Subtle & Clean) -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="170" height="22" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#38bdf8" />
    <text x="20" y="15" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9.5" letter-spacing="0.5">
      STANDARD PHONE USB CABLE
    </text>
    <text x="0" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16">
      Standard USB-A to Type-C Cable
    </text>
    <text x="0" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">
      Standard phone charger cable · Works with any phone adapter or power bank
    </text>
  </g>
</svg>
