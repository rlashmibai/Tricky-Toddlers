<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Ambient Background -->
    <radialGradient id="boxStudioBg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#0b1526" />
      <stop offset="60%" stop-color="#060c17" />
      <stop offset="100%" stop-color="#02050a" />
    </radialGradient>

    <!-- Drop Shadow for the entire half-open box -->
    <filter id="boxDropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.2" />
    </filter>

    <!-- Box Base Outer Shell (Frosted Deep Navy / Slate Polymer) -->
    <linearGradient id="baseShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Interior Recessed Tray -->
    <linearGradient id="interiorTray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Half-Open Lid Gradient (Translucent Frosted Acrylic angled open) -->
    <linearGradient id="lidOpen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#94a3b8" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#cbd5e1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Metallic Cyan Latches -->
    <linearGradient id="latchCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Foam Cutout Inner Shadow -->
    <filter id="cutoutDepth">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#boxStudioBg)" />

  <!-- Subtle glow beneath box -->
  <ellipse cx="300" cy="380" rx="220" ry="32" fill="#0284c7" fill-opacity="0.08" />

  <!-- ================= THE HALF-OPEN STORAGE BOX ================= -->
  <g transform="translate(60, 45)" filter="url(#boxDropShadow)">
    
    <!-- 1. BACK / INSIDE OF HALF-OPEN LID (Tilted back at ~45-50 degrees) -->
    <g transform="translate(15, 0)">
      <!-- Angled Lid Polygon (Perspective open upward) -->
      <polygon points="35,145 415,145 440,25 10,25" fill="url(#lidOpen)" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.5" />
      
      <!-- Lid Lip / Rim Highlight -->
      <line x1="10" y1="25" x2="440" y2="25" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" />
      <!-- Left & Right Angled Rim Struts -->
      <line x1="10" y1="25" x2="35" y2="145" stroke="#cbd5e1" stroke-width="1.8" stroke-opacity="0.6" />
      <line x1="440" y1="25" x2="415" y2="145" stroke="#cbd5e1" stroke-width="1.8" stroke-opacity="0.6" />

      <!-- Translucent Internal Reinforcement Ribs on Inside Lid -->
      <line x1="150" y1="30" x2="160" y2="140" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
      <line x1="300" y1="30" x2="290" y2="140" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

      <!-- Lid Clasps (Upraised on the open lid) -->
      <rect x="120" y="15" width="46" height="12" rx="3" fill="url(#latchCyan)" stroke="#38bdf8" stroke-width="1" />
      <rect x="280" y="15" width="46" height="12" rx="3" fill="url(#latchCyan)" stroke="#38bdf8" stroke-width="1" />

      <!-- Top Frosted Gloss Sheen on Open Lid -->
      <polygon points="12,27 240,27 210,95 24,95" fill="#ffffff" fill-opacity="0.08" />
    </g>

    <!-- 2. HINGE MECHANISM AT BACK OF BASE -->
    <rect x="100" y="140" width="70" height="9" rx="3" fill="#334155" stroke="#475569" stroke-width="1" />
    <rect x="310" y="140" width="70" height="9" rx="3" fill="#334155" stroke="#475569" stroke-width="1" />

    <!-- 3. BOX LOWER MAIN BASE (Deep Compartment Tray) -->
    <!-- Base Outer Body -->
    <rect x="30" y="145" width="420" height="185" rx="16" fill="url(#baseShell)" stroke="#475569" stroke-width="2.5" />
    <!-- Front Face Bevel Shadow -->
    <rect x="30" y="315" width="420" height="15" rx="6" fill="#05080f" />

    <!-- Dual Front Latch Catches -->
    <rect x="135" y="312" width="46" height="14" rx="4" fill="url(#latchCyan)" stroke="#0284c7" stroke-width="1" />
    <rect x="295" y="312" width="46" height="14" rx="4" fill="url(#latchCyan)" stroke="#0284c7" stroke-width="1" />

    <!-- 4. INTERIOR CUSTOM-MOLDED COMPARTMENT INSERT (Fitted Foam / Plastic Tray) -->
    <rect x="42" y="156" width="396" height="155" rx="12" fill="url(#interiorTray)" stroke="#334155" stroke-width="1.5" />

    <!-- Divider Grid Lines -->
    <line x1="210" y1="162" x2="210" y2="305" stroke="#1e293b" stroke-width="2.5" />
    <line x1="48" y1="232" x2="208" y2="232" stroke="#1e293b" stroke-width="2" />

    <!-- ================= COMPARTMENT A: SENSOR POD (Top Left Slot) ================= -->
    <g transform="translate(56, 168)" filter="url(#cutoutDepth)">
      <!-- Custom Circular Foam Cavity -->
      <circle cx="68" cy="30" r="28" fill="#020617" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      
      <!-- Sensor Pod Resting Inside -->
      <circle cx="68" cy="30" r="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
      <circle cx="68" cy="30" r="16" fill="#f8fafc" />
      <!-- Pulsing Cyan Telemetry LED -->
      <circle cx="68" cy="30" r="4" fill="#38bdf8" />
      <circle cx="68" cy="30" r="1.5" fill="#ffffff" />
      
      <!-- Label -->
      <text x="108" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5">Sensor Pod</text>
      <text x="108" y="39" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5">12g Modular</text>
    </g>

    <!-- ================= COMPARTMENT B: DIAPER CLIP-IT BOX (Bottom Left Slot) ================= -->
    <g transform="translate(56, 242)" filter="url(#cutoutDepth)">
      <!-- Rectangular Dock Cavity -->
      <rect x="18" y="8" width="80" height="48" rx="8" fill="#020617" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4" />
      
      <!-- Clip-It Diaper Dock -->
      <rect x="25" y="14" width="66" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="58" cy="32" r="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <rect x="74" y="22" width="12" height="20" rx="3" fill="#06b6d4" />

      <!-- Label -->
      <text x="108" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5">Clip-It Dock</text>
      <text x="108" y="40" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5">0-12 mo. Diaper</text>
    </g>

    <!-- ================= COMPARTMENT C: 3 COTTON STRAPS & PHONE USB CABLE (Right Slot) ================= -->
    <g transform="translate(222, 168)" filter="url(#cutoutDepth)">
      <!-- Large Cavity for Straps & Cable -->
      <rect x="8" y="6" width="194" height="128" rx="10" fill="#020617" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />

      <!-- 3 Straps Neatly Rolled / Folded -->
      <!-- Strap 1 (Pink XS) -->
      <rect x="20" y="16" width="170" height="18" rx="9" fill="#f472b6" stroke="#fbcfe8" stroke-width="1" />
      <circle cx="105" cy="25" r="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="175" y="29" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" text-anchor="end">XS (1-2y)</text>

      <!-- Strap 2 (Sky Blue S) -->
      <rect x="20" y="40" width="170" height="19" rx="9.5" fill="#38bdf8" stroke="#bae6fd" stroke-width="1" />
      <circle cx="105" cy="49" r="7.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="175" y="53" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" text-anchor="end">Small (2-4y)</text>

      <!-- Strap 3 (Teal/Mint M) -->
      <rect x="20" y="65" width="170" height="20" rx="10" fill="#34d399" stroke="#a7f3d0" stroke-width="1" />
      <circle cx="105" cy="75" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="175" y="79" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" text-anchor="end">Medium (4-8y)</text>

      <!-- Coiled Phone USB Cable -->
      <path d="M 30,108 C 45,95 70,118 95,108 C 120,98 145,120 170,108" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <!-- USB-A Connector -->
      <rect x="22" y="103" width="12" height="10" rx="2" fill="#94a3b8" />
      <!-- USB-C Connector -->
      <rect x="166" y="104" width="10" height="8" rx="3" fill="#94a3b8" />
      <text x="105" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" text-anchor="middle">Phone USB Quick Cable</text>
    </g>
  </g>

  <!-- Clear Minimal Badge at Top Left -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
    <text x="24" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9.5" letter-spacing="0.5">
      HALF-OPEN STORAGE BOX
    </text>
  </g>
</svg>
