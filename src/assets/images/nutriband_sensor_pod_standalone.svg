<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="70%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>

    <!-- Outer Sensor Pod Shadow -->
    <filter id="podShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>

    <!-- White Medical Polymer Casing Outer Bevel -->
    <linearGradient id="casingBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Inner Face Surface -->
    <radialGradient id="innerFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Gold Charging / Sensor Contacts -->
    <linearGradient id="goldContact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Dual Thermistor Precision Sensor Window (Silver / Platinum) -->
    <linearGradient id="thermistorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Cyan Telemetry Glow -->
    <radialGradient id="cyanTelemetryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Inner Rim Reflection -->
    <linearGradient id="rimGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid / Alignment Reticle -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="#38bdf8" stroke-opacity="0.05" stroke-dasharray="4 8" />
  <circle cx="300" cy="300" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.04" />

  <!-- ================= MAIN ISOLATED SENSOR POD BODY (ROUND COIN DESIGN) ================= -->
  <g filter="url(#podShadow)">
    <!-- Base Outer Polymer Shell (36mm diameter equivalent) -->
    <circle cx="300" cy="300" r="150" fill="url(#casingBevel)" />

    <!-- Top Surface Specular Crescent Highlight -->
    <ellipse cx="300" cy="180" rx="120" ry="25" fill="url(#rimGloss)" opacity="0.6" />

    <!-- Outer Precision Chamfer Ring -->
    <circle cx="300" cy="300" r="142" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Recessed Sensor Face -->
    <circle cx="300" cy="300" r="136" fill="url(#innerFace)" />

    <!-- High-Precision Metric Calibration Ticks around rim -->
    <g opacity="0.35" stroke="#475569" stroke-width="1.5">
      <line x1="300" y1="168" x2="300" y2="176" />
      <line x1="300" y1="424" x2="300" y2="432" />
      <line x1="168" y1="300" x2="176" y2="300" />
      <line x1="424" y1="300" x2="432" y2="300" />
      <line x1="206" y1="206" x2="213" y2="213" />
      <line x1="394" y1="394" x2="387" y2="387" />
      <line x1="206" y1="394" x2="213" y2="387" />
      <line x1="394" y1="206" x2="387" y2="213" />
    </g>

    <!-- Inner Core Telemetry Bezel -->
    <circle cx="300" cy="300" r="92" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="300" cy="300" r="88" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />

    <!-- Center Medical-Grade Thermistor / Optical Biosensor Array -->
    <circle cx="300" cy="300" r="54" fill="#020617" stroke="#334155" stroke-width="2" />
    <circle cx="300" cy="300" r="46" fill="url(#thermistorGrad)" opacity="0.25" />

    <!-- Dual Clinical Skin-Contact Thermistors -->
    <circle cx="282" cy="300" r="9" fill="url(#thermistorGrad)" stroke="#475569" stroke-width="1" />
    <circle cx="282" cy="300" r="5" fill="#f8fafc" />
    <circle cx="318" cy="300" r="9" fill="url(#thermistorGrad)" stroke="#475569" stroke-width="1" />
    <circle cx="318" cy="300" r="5" fill="#f8fafc" />

    <!-- Active Micro-LED Telemetry Breathing Light (Pulsing Cyan Core) -->
    <circle cx="300" cy="235" r="16" fill="url(#cyanTelemetryGlow)" />
    <circle cx="300" cy="235" r="4.5" fill="#38bdf8" />
    <circle cx="300" cy="235" r="2" fill="#ffffff" />

    <!-- Gold Magnetic Pogo Charging Pins (Perimeter) -->
    <g>
      <!-- Pin 1 -->
      <circle cx="280" cy="365" r="5.5" fill="url(#goldContact)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="280" cy="365" r="2.5" fill="#fef08a" />
      <!-- Pin 2 -->
      <circle cx="300" cy="365" r="5.5" fill="url(#goldContact)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="300" cy="365" r="2.5" fill="#fef08a" />
      <!-- Pin 3 -->
      <circle cx="320" cy="365" r="5.5" fill="url(#goldContact)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="320" cy="365" r="2.5" fill="#fef08a" />
    </g>

    <!-- Laser Etched Typography -->
    <text x="300" y="270" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" letter-spacing="1.5" text-anchor="middle">
      NUTRIBAND
    </text>
    <text x="300" y="332" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">
      TELEMETRY POD · 12g
    </text>
    <text x="300" y="344" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7" letter-spacing="0.8" text-anchor="middle">
      BLE 5.3 · IP67 MEDICAL GRADE
    </text>
  </g>

  <!-- Clean Floating Spec Callouts (Professional & Minimal) -->
  <g transform="translate(420, 150)">
    <rect x="0" y="0" width="130" height="26" rx="7" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" text-anchor="middle">
      SENSOR POD ONLY
    </text>
  </g>

  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#34d399" />
    <text x="24" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5">
      Featherlight 12g Modular Unit
    </text>
  </g>

  <g transform="translate(370, 480)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
    <text x="24" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5">
      Fits Diaper Clip &amp; Cotton Strap
    </text>
  </g>
</svg>
