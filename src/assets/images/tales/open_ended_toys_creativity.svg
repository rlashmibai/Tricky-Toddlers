<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#fb923c" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#fb923c" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb923c" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb923c" letter-spacing="2">LEARNING</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Rainbow Wooden Arcs & Cardboard Box Imagination -->
    <g transform="translate(350, 190)">
      <path d="M -50 0 A 50 50 0 0 1 50 0" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
      <path d="M -38 0 A 38 38 0 0 1 38 0" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
      <path d="M -26 0 A 26 26 0 0 1 26 0" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
      <path d="M -14 0 A 14 14 0 0 1 14 0" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    </g>
    <!-- Geometric wooden blocks beside -->
    <rect x="430" y="150" width="40" height="40" rx="6" fill="#facc15" stroke="#ffffff" stroke-width="2" />
    <polygon points="495,145 475,190 515,190" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
    <!-- Sparkles of child thinking -->
    <circle cx="350" cy="115" r="6" fill="#facc15" />
    <circle cx="380" cy="95" r="4" fill="#facc15" />
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Open-Ended Toys vs Electronic Screens</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Wooden Blocks &amp; Cardboard Boxes · Child-Led Thinking · Deep Imagination</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb923c" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb923c" />
    </g>
  </g>
</svg>
