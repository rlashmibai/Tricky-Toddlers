<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#2dd4bf" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: The Power of Two Bounded Choices (Yellow Sun Shirt vs Blue Rocket Shirt) -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Base Platform -->
    <ellipse cx="0" cy="65" rx="210" ry="22" fill="#0f766e" opacity="0.4" stroke="#2dd4bf" stroke-width="2" />

    <!-- CHOICE A (Left): Cheerful Sunny Yellow T-Shirt Card -->
    <g transform="translate(-110, 0)">
      <!-- Selection Card Frame -->
      <rect x="-65" y="-55" width="130" height="115" rx="16" fill="#1e293b" stroke="#fde047" stroke-width="2.5" />
      <!-- Choice A Label -->
      <rect x="-45" y="-70" width="90" height="22" rx="11" fill="#fde047" />
      <text x="0" y="-55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#78350f" text-anchor="middle">CHOICE 1</text>
      <!-- Yellow T-Shirt -->
      <path d="M -25 -25 L -45 -10 L -35 10 L -25 5 L -25 35 L 25 35 L 25 5 L 35 10 L 45 -10 L 25 -25 C 15 -18 -15 -18 -25 -25 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
      <!-- Sun Emblem on shirt -->
      <circle cx="0" cy="5" r="9" fill="#ef4444" />
      <circle cx="0" cy="5" r="6" fill="#fde047" />
    </g>

    <!-- "OR" Center Badge -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#2dd4bf" stroke-width="2.5" />
      <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#2dd4bf" text-anchor="middle">OR</text>
      <!-- Toddler Pointer Hand choosing happily -->
      <g transform="translate(0, 48)">
        <rect x="-6" y="-12" width="12" height="24" rx="6" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
        <polygon points="0,-18 -6,-10 6,-10" fill="#fed7aa" />
      </g>
    </g>

    <!-- CHOICE B (Right): Cool Blue Rocket T-Shirt Card -->
    <g transform="translate(110, 0)">
      <!-- Selection Card Frame -->
      <rect x="-65" y="-55" width="130" height="115" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Choice B Label -->
      <rect x="-45" y="-70" width="90" height="22" rx="11" fill="#38bdf8" />
      <text x="0" y="-55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#0c4a6e" text-anchor="middle">CHOICE 2</text>
      <!-- Blue T-Shirt -->
      <path d="M -25 -25 L -45 -10 L -35 10 L -25 5 L -25 35 L 25 35 L 25 5 L 35 10 L 45 -10 L 25 -25 C 15 -18 -15 -18 -25 -25 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
      <!-- Rocket Emblem on shirt -->
      <polygon points="0,-8 5,8 -5,8" fill="#f8fafc" />
      <polygon points="0,8 -3,14 3,14" fill="#ef4444" /> <!-- Flame -->
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Healthy Toddler Independence</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Offering Bounded Choices · Fostering Early Self-Identity</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#5eead4" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#5eead4" />
    </g>
  </g>
</svg>
