<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fde047" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fde047" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Central Thematic Illustration: The 2-to-1 Nap Transition Clocks & Cozy Midday Bed -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Old Schedule on Left: 2 Mini Naps -->
    <g transform="translate(-160, 0)">
      <circle cx="0" cy="0" r="48" fill="#1e293b" stroke="#64748b" stroke-width="3" />
      <!-- Clock Face: 10:00 AM -->
      <line x1="0" y1="0" x2="-22" y2="-12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="-32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#f8fafc" />
      <!-- Red Soft X across early nap -->
      <circle cx="0" cy="0" r="46" fill="#000000" opacity="0.3" />
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#94a3b8" text-anchor="middle">2 NAPS (PAST)</text>
    </g>

    <!-- Transition Arrow in Middle -->
    <g transform="translate(0, -30)">
      <path d="M -70 0 Q 0 -25 70 0" fill="none" stroke="#fde047" stroke-width="4" stroke-dasharray="6 6" />
      <polygon points="72,0 60,-8 62,8" fill="#fde047" />
      <!-- Consolidated Rest Badge -->
      <rect x="-65" y="10" width="130" height="26" rx="13" fill="#1e1b4b" stroke="#fde047" stroke-width="2" />
      <text x="0" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fde047" text-anchor="middle">12:30 PM ANCHOR</text>
    </g>

    <!-- New Target Schedule on Right: 1 Big Consolidated Nap -->
    <g transform="translate(160, 0)">
      <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#22c55e" stroke-width="4" />
      <!-- Clock Face: 12:30 PM -->
      <line x1="0" y1="0" x2="2" y2="-36" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="28" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="5" fill="#fef08a" />
      <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#4ade80" text-anchor="middle">1 CONSOLIDATED NAP</text>
    </g>

    <!-- Midday Rest Cot Underneath -->
    <g transform="translate(0, 50)">
      <rect x="-100" y="0" width="200" height="30" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5" />
      <rect x="-90" y="-10" width="45" height="18" rx="6" fill="#f8fafc" /> <!-- Pillow -->
      <path d="M -40 -2 Q 20 -15 90 0 L 90 28 L -40 28 Z" fill="#3b82f6" opacity="0.85" />
      <text x="70" y="-12" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#fef08a">z</text>
      <text x="82" y="-22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#fef08a">Z</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Smooth 2-to-1 Nap Drop</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">12:30 PM Rest Anchor · Preventing 5 PM Overtired Meltdowns</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fde047" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fde047" />
    </g>
  </g>
</svg>
