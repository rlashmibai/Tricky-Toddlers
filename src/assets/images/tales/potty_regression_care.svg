<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c2e47" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="180" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="180" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">POTTY TRAINING</text>
  </g>

  <!-- Central Thematic Illustration: Compassionate Regression Care (Stepping Stones, Fresh Pants, Reassuring Hand) -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Stepping Stones Path in Bathroom / Nursery -->
    <ellipse cx="-130" cy="55" rx="35" ry="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="-40" cy="62" rx="35" ry="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="50" cy="55" rx="35" ry="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <ellipse cx="140" cy="45" rx="35" ry="16" fill="#0284c7" stroke="#7dd3fc" stroke-width="2.5" />

    <!-- Cute Friendly Toddler Potty on the Destination Stone (Far Right) -->
    <g transform="translate(140, 10)">
      <rect x="-24" y="-25" width="48" height="42" rx="12" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />
      <ellipse cx="0" cy="-25" rx="22" ry="12" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="0" cy="-5" r="4" fill="#38bdf8" />
    </g>

    <!-- Fresh Stack of Clean Cotton Training Pants in Center -->
    <g transform="translate(-40, 0)">
      <!-- Pants 1 (Bottom - Blue) -->
      <path d="M -35 20 L 35 20 L 28 42 C 15 42 10 50 0 50 C -10 50 -15 42 -28 42 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5" />
      <!-- Pants 2 (Middle - Yellow) -->
      <path d="M -35 5 L 35 5 L 28 27 C 15 27 10 35 0 35 C -10 35 -15 27 -28 27 Z" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
      <!-- Pants 3 (Top - Mint) -->
      <path d="M -35 -10 L 35 -10 L 28 12 C 15 12 10 20 0 20 C -10 20 -15 12 -28 12 Z" fill="#6ee7b7" stroke="#059669" stroke-width="1.5" />
    </g>

    <!-- Parent Reassuring Gentle Hand Reaching Down with Love on Left -->
    <g transform="translate(-130, -10)">
      <rect x="-18" y="-45" width="36" height="50" rx="12" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
      <!-- Reassuring pat fingers -->
      <rect x="-15" y="0" width="7" height="20" rx="3.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="-6" y="0" width="7" height="24" rx="3.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="3" y="0" width="7" height="22" rx="3.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="11" y="0" width="6" height="18" rx="3" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
    </g>

    <!-- Zero-Shame Affirmation Badge overhead -->
    <g transform="translate(0, -60)">
      <rect x="-85" y="0" width="170" height="26" rx="13" fill="#0f172a" stroke="#4ade80" stroke-width="2" />
      <text x="0" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#4ade80" text-anchor="middle" letter-spacing="1">ZERO SHAME · NORMAL STEP</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Handling Potty Regressions</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">New Siblings or Illness · Temporary Pull-Ups with Zero Shame</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#7dd3fc" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#7dd3fc" />
    </g>
  </g>
</svg>
