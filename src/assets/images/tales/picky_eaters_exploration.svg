<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#34d399" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#34d399" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#34d399" letter-spacing="2">MEALTIME</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Tasting Board -->
    <rect x="290" y="150" width="220" height="90" rx="20" fill="#1e293b" stroke="#34d399" stroke-width="3" />
    <!-- 4 Tasting Pods -->
    <circle cx="330" cy="195" r="24" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <circle cx="330" cy="195" r="12" fill="#ef4444" /> <!-- Strawberry -->
    <circle cx="380" cy="195" r="24" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <circle cx="380" cy="195" r="12" fill="#22c55e" /> <!-- Steamed pea/broccoli -->
    <circle cx="430" cy="195" r="24" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <circle cx="430" cy="195" r="12" fill="#f59e0b" /> <!-- Carrot cube -->
    <circle cx="480" cy="195" r="24" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <circle cx="480" cy="195" r="10" fill="#38bdf8" /> <!-- Blueberry -->

    <!-- Inquisitive exploration magnifying glass -->
    <g transform="translate(440, 110)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#facc15" stroke-width="5" />
      <line x1="18" y1="18" x2="36" y2="36" stroke="#facc15" stroke-width="6" stroke-linecap="round" />
      <polygon points="0,-8 3,-2 8,-2 4,2 6,8 0,4 -6,8 -4,2 -8,-2 -3,-2" fill="#facc15" />
    </g>
    <!-- Encouragement hearts -->
    <path d="M 330 110 C 330 102 342 98 350 106 C 358 98 370 102 370 110 C 370 122 350 135 350 135 C 350 135 330 122 330 110 Z" fill="#ec4899" />
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Picky Eaters: From Rejection to Exploration</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Low-Pressure Sensory Exposure · Tiny Tastes · Confident Eaters</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#34d399" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#34d399" />
    </g>
  </g>
</svg>
