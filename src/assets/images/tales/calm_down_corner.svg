<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Warm fairy lights string hanging overhead -->
  <path d="M 120 70 Q 260 110 400 75 Q 540 110 680 70" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="200" cy="95" r="7" fill="#fde047" opacity="0.9" />
  <circle cx="280" cy="98" r="7" fill="#fde047" opacity="0.9" />
  <circle cx="360" cy="85" r="7" fill="#fde047" opacity="0.9" />
  <circle cx="440" cy="85" r="7" fill="#fde047" opacity="0.9" />
  <circle cx="520" cy="98" r="7" fill="#fde047" opacity="0.9" />
  <circle cx="600" cy="95" r="7" fill="#fde047" opacity="0.9" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb7185" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb7185" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Central Thematic Illustration: The Cozy Calm-Down Nook -->
  <g filter="url(#shadow)" transform="translate(400, 185)">
    <!-- Soft circular braided nursery rug -->
    <ellipse cx="0" cy="65" rx="200" ry="28" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <ellipse cx="0" cy="65" rx="160" ry="20" fill="#334155" stroke="#f472b6" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Big Giant Plush Floor Pouf Cushion -->
    <ellipse cx="-40" cy="35" rx="100" ry="45" fill="url(#cushionGrad)" stroke="#fecdd3" stroke-width="3" />
    <!-- Secondary Mint Cushion -->
    <ellipse cx="70" cy="40" rx="75" ry="35" fill="#10b981" stroke="#a7f3d0" stroke-width="3" />

    <!-- Cute Teddy Bear sitting on cushion -->
    <g transform="translate(-50, 10)">
      <!-- Ears -->
      <circle cx="-22" cy="-35" r="10" fill="#b45309" stroke="#d97706" stroke-width="1.5" />
      <circle cx="-22" cy="-35" r="5" fill="#fde68a" />
      <circle cx="22" cy="-35" r="10" fill="#b45309" stroke="#d97706" stroke-width="1.5" />
      <circle cx="22" cy="-35" r="5" fill="#fde68a" />
      <!-- Head -->
      <circle cx="0" cy="-20" r="28" fill="#d97706" stroke="#b45309" stroke-width="2" />
      <!-- Muzzle -->
      <ellipse cx="0" cy="-14" rx="12" ry="9" fill="#fde68a" />
      <polygon points="0,-18 -4,-13 4,-13" fill="#78350f" />
      <!-- Friendly Eyes -->
      <circle cx="-9" cy="-24" r="3" fill="#451a03" />
      <circle cx="9" cy="-24" r="3" fill="#451a03" />
      <!-- Body & Paws -->
      <ellipse cx="0" cy="12" rx="24" ry="20" fill="#d97706" />
      <ellipse cx="0" cy="14" rx="15" ry="13" fill="#fde68a" />
      <circle cx="-22" cy="16" r="8" fill="#b45309" />
      <circle cx="22" cy="16" r="8" fill="#b45309" />
    </g>

    <!-- Sensory Glitter Calming Bottle -->
    <g transform="translate(130, 20)">
      <rect x="-14" y="-45" width="28" height="60" rx="10" fill="#38bdf8" opacity="0.85" stroke="#e0f2fe" stroke-width="2" />
      <!-- Bottle Cap -->
      <rect x="-8" y="-55" width="16" height="12" rx="3" fill="#0284c7" />
      <!-- Swirling calming glitter -->
      <circle cx="-5" cy="-25" r="3" fill="#fef08a" />
      <circle cx="5" cy="-15" r="4" fill="#ec4899" />
      <circle cx="-3" cy="-5" r="3" fill="#a855f7" />
      <circle cx="6" cy="5" r="2.5" fill="#fef08a" />
      <path d="M -8 -30 Q 8 -15 -6 5" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" />
    </g>

    <!-- Open Soft Board Book: "Big Feelings" -->
    <g transform="translate(-140, 35) rotate(-8)">
      <rect x="-35" y="-22" width="70" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#94a3b8" stroke-width="2" />
      <circle cx="-16" cy="-4" r="8" fill="#fde047" />
      <text x="18" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="7" fill="#475569" text-anchor="middle">CALM</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The Calm-Down Corner</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Cozy Cushions · Soft Books · Regulation Nook Instead of Time-Out</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb7185" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb7185" />
    </g>
  </g>
</svg>
