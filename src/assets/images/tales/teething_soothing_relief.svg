<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="iceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#facc15" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#facc15" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Central Thematic Illustration: Chilled Silicone Teether, Frozen Cloth Knot, Gum Massager -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Chilled Ice Aura in Background -->
    <circle cx="0" cy="0" r="105" fill="url(#iceGlow)" />

    <!-- Centerpiece: Textured Silicone Teething Ring (Chilled Mint Green & Ice Blue) -->
    <g transform="translate(-15, 0)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="#2dd4bf" stroke-width="22" />
      <circle cx="0" cy="0" r="58" fill="none" stroke="#14b8a6" stroke-width="2" />
      <!-- Bumpy Sensory Texture Nubs on ring -->
      <circle cx="-58" cy="0" r="4" fill="#99f6e4" />
      <circle cx="58" cy="0" r="4" fill="#99f6e4" />
      <circle cx="0" cy="-58" r="4" fill="#99f6e4" />
      <circle cx="0" cy="58" r="4" fill="#99f6e4" />
      <circle cx="-41" cy="-41" r="4" fill="#99f6e4" />
      <circle cx="41" cy="-41" r="4" fill="#99f6e4" />
      <circle cx="-41" cy="41" r="4" fill="#99f6e4" />
      <circle cx="41" cy="41" r="4" fill="#99f6e4" />

      <!-- Center Cute Silicone Star Gripper -->
      <polygon points="0,-18 5,-6 18,-6 8,2 12,15 0,7 -12,15 -8,2 -18,-6 -5,-6" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
    </g>

    <!-- Chilled Damp Organic Washcloth Knot on Left -->
    <g transform="translate(-145, 10) rotate(-15)">
      <!-- Rolled and Knotted Cloth -->
      <path d="M -35 15 C -20 -30 20 -30 35 15 C 20 25 -20 25 -35 15 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <ellipse cx="0" cy="-10" rx="14" ry="10" fill="#e2e8f0" /> <!-- Knot center -->
      <!-- Cooling Ice Crystals -->
      <polygon points="-8,-45 0,-52 8,-45 0,-38" fill="#38bdf8" />
      <polygon points="25,-30 31,-36 37,-30 31,-24" fill="#38bdf8" />
      <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#bae6fd" text-anchor="middle">COLD CLOTH</text>
    </g>

    <!-- Silicone Finger Gum Massage Brush on Right -->
    <g transform="translate(135, 10)">
      <!-- Finger Sheath -->
      <path d="M -14 30 L -14 -20 C -14 -35 14 -35 14 -20 L 14 30 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
      <!-- Soft Bristles on Front -->
      <line x1="-10" y1="-20" x2="-2" y2="-20" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="-12" x2="-2" y2="-12" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="-4" x2="-2" y2="-4" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="4" x2="-2" y2="4" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="12" x2="-2" y2="12" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#bae6fd" text-anchor="middle">GUM BRUSH</text>
    </g>

    <!-- Gentle Relief Tag Overhead -->
    <g transform="translate(0, -68)">
      <rect x="-75" y="0" width="150" height="26" rx="13" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
      <text x="0" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#5eead4" text-anchor="middle" letter-spacing="1">NATURAL GUM RELIEF</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Soothing Teething Nights</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Chilled Silicone Teether · Gentle Gum Massage · Peaceful Sleep</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#facc15" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#facc15" />
    </g>
  </g>
</svg>
