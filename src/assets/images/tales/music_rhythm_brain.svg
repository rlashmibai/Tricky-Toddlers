<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#a855f7" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#a855f7" letter-spacing="2">LEARNING</text>
  </g>

  <!-- Central Thematic Illustration: Rainbow Toddler Xylophone, Wooden Mallets & Floating Notes -->
  <g filter="url(#shadow)" transform="translate(400, 185)">
    <!-- Wooden Xylophone Frame Base -->
    <polygon points="-160,50 160,40 145,-10 -145,-20" fill="#78350f" stroke="#b45309" stroke-width="2" />

    <!-- 8 Rainbow Xylophone Tone Bars (Graduated lengths C to C) -->
    <!-- Bar 1: Red (C - Longest) -->
    <rect x="-140" y="-35" width="26" height="95" rx="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5" />
    <circle cx="-127" cy="-22" r="3" fill="#ffffff" />
    <circle cx="-127" cy="48" r="3" fill="#ffffff" />

    <!-- Bar 2: Orange (D) -->
    <rect x="-105" y="-30" width="26" height="88" rx="6" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />
    <circle cx="-92" cy="-18" r="3" fill="#ffffff" />
    <circle cx="-92" cy="46" r="3" fill="#ffffff" />

    <!-- Bar 3: Yellow (E) -->
    <rect x="-70" y="-25" width="26" height="80" rx="6" fill="#facc15" stroke="#eab308" stroke-width="1.5" />
    <circle cx="-57" cy="-14" r="3" fill="#ffffff" />
    <circle cx="-57" cy="44" r="3" fill="#ffffff" />

    <!-- Bar 4: Green (F) -->
    <rect x="-35" y="-20" width="26" height="74" rx="6" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
    <circle cx="-22" cy="-10" r="3" fill="#ffffff" />
    <circle cx="-22" cy="42" r="3" fill="#ffffff" />

    <!-- Bar 5: Cyan (G) -->
    <rect x="0" y="-16" width="26" height="68" rx="6" fill="#06b6d4" stroke="#0891b2" stroke-width="1.5" />
    <circle cx="13" cy="-7" r="3" fill="#ffffff" />
    <circle cx="13" cy="40" r="3" fill="#ffffff" />

    <!-- Bar 6: Blue (A) -->
    <rect x="35" y="-12" width="26" height="62" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="48" cy="-4" r="3" fill="#ffffff" />
    <circle cx="48" cy="38" r="3" fill="#ffffff" />

    <!-- Bar 7: Indigo (B) -->
    <rect x="70" y="-8" width="26" height="56" rx="6" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" />
    <circle cx="83" cy="0" r="3" fill="#ffffff" />
    <circle cx="83" cy="36" r="3" fill="#ffffff" />

    <!-- Bar 8: Violet (C' - Shortest) -->
    <rect x="105" y="-4" width="26" height="50" rx="6" fill="#a855f7" stroke="#9333ea" stroke-width="1.5" />
    <circle cx="118" cy="3" r="3" fill="#ffffff" />
    <circle cx="118" cy="34" r="3" fill="#ffffff" />

    <!-- Wooden Mallet Striking the Yellow Bar -->
    <g transform="translate(-57, -15)">
      <line x1="0" y1="0" x2="-40" y2="-75" stroke="#fde68a" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="9" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <!-- Sound burst sparkles from mallet strike -->
      <polygon points="0,-18 3,-10 11,-10 5,-5 7,3 0,-1 -7,3 -5,-5 -11,-10 -3,-10" fill="#fde047" />
    </g>

    <!-- Floating Musical Notes Dancing Upward -->
    <!-- Eighth note pair -->
    <g transform="translate(60, -65)">
      <ellipse cx="-10" cy="0" rx="6" ry="5" fill="#f472b6" transform="rotate(-20 -10 0)" />
      <ellipse cx="14" cy="-5" rx="6" ry="5" fill="#f472b6" transform="rotate(-20 14 -5)" />
      <line x1="-5" y1="0" x2="-5" y2="-25" stroke="#f472b6" stroke-width="2.5" />
      <line x1="19" y1="-5" x2="19" y2="-30" stroke="#f472b6" stroke-width="2.5" />
      <polygon points="-5,-25 19,-30 19,-24 -5,-19" fill="#f472b6" />
    </g>

    <!-- Treble Clef Icon on Upper Left -->
    <g transform="translate(-150, -65)">
      <circle cx="0" cy="0" r="20" fill="#ec4899" opacity="0.2" />
      <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#f472b6" text-anchor="middle">𝄞</text>
    </g>

    <!-- Quarter note -->
    <g transform="translate(-20, -75)">
      <ellipse cx="0" cy="0" rx="6" ry="5" fill="#38bdf8" transform="rotate(-20 0 0)" />
      <line x1="5" y1="0" x2="5" y2="-24" stroke="#38bdf8" stroke-width="2.5" />
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Music &amp; Rhythm for Brain Wiring</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Xylophone Beats · Clapping Rhymes · Bilateral Brain Synapses</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#a855f7" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#a855f7" />
    </g>
  </g>
</svg>
