<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Playful Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="160" fill="#34d399" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#34d399" opacity="0.1" filter="blur(50px)" />

  <!-- Category Pill Badge at Top Left -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#34d399" letter-spacing="2">MEALTIME</text>
  </g>

  <!-- Visual Central Illustration -->
  <g filter="url(#shadow)">
    
      <!-- High Chair & Dining Table -->
      <circle cx="400" cy="180" r="100" fill="url(#sunGlow)" opacity="0.3" />
      <!-- Dining Plate -->
      <circle cx="400" cy="220" r="65" fill="#1e293b" stroke="#34d399" stroke-width="4" />
      <circle cx="400" cy="220" r="50" fill="#0f172a" />
      <!-- Fresh Finger Foods -->
      <circle cx="385" cy="210" r="14" fill="#ef4444" /> <!-- Strawberry -->
      <circle cx="415" cy="208" r="12" fill="#22c55e" /> <!-- Steamed Broccoli -->
      <rect x="388" y="228" width="28" height="12" rx="4" fill="#f59e0b" /> <!-- Carrot baton -->
      <circle cx="375" cy="232" r="8" fill="#3b82f6" /> <!-- Blueberries -->
      <!-- Spoon & Fork -->
      <rect x="305" y="195" width="8" height="50" rx="4" fill="#94a3b8" transform="rotate(-15 305 195)" />
      <circle cx="302" cy="190" r="12" fill="#94a3b8" />
      <rect x="495" y="195" width="8" height="50" rx="4" fill="#94a3b8" transform="rotate(15 495 195)" />
      <!-- NO SCREENS BADGE -->
      <g transform="translate(400, 100)">
        <circle cx="0" cy="0" r="42" fill="#ef4444" opacity="0.15" />
        <circle cx="0" cy="0" r="34" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
        <!-- Phone rect -->
        <rect x="-14" y="-20" width="28" height="40" rx="5" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
        <circle cx="0" cy="14" r="2.5" fill="#ffffff" />
        <!-- Red Diagonal Slash -->
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      </g>
      <!-- Heart & Joy Sparkles -->
      <path d="M 470 110 C 470 100 485 95 495 105 C 505 95 520 100 520 110 C 520 125 495 140 495 140 C 495 140 470 125 470 110 Z" fill="#ec4899" />
      <circle cx="310" cy="120" r="5" fill="#facc15" />
      <circle cx="330" cy="100" r="3" fill="#facc15" />
    
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    
    <!-- Title -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Screen-Free Mealtime Mastery</text>
    
    <!-- Tagline / Subtitle -->
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Connect at the Table · No Screens · Joyful Family Dining</text>

    <!-- Star verified badge at right -->
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#34d399" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#34d399" />
    </g>
  </g>
</svg>
