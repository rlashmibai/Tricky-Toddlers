<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#021727" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">LEARNING</text>
  </g>

  <!-- Central Thematic Illustration: Sink with Float vs Sink Experiments & Bubbles -->
  <g filter="url(#shadow)" transform="translate(400, 185)">
    <!-- Water Basin / Sink Outline -->
    <rect x="-180" y="-35" width="360" height="110" rx="20" fill="#0f172a" stroke="#64748b" stroke-width="4" />
    <!-- Water Inside Basin -->
    <rect x="-174" y="-10" width="348" height="80" rx="14" fill="url(#waterGrad)" />
    <!-- Water ripples on surface -->
    <path d="M -170 -10 Q -120 -18 -80 -10 Q -40 -3 0 -10 Q 40 -18 80 -10 Q 120 -3 170 -10" fill="none" stroke="#e0f2fe" stroke-width="3" />

    <!-- FLOATING OBJECT 1: Yellow Rubber Duckie on surface -->
    <g transform="translate(-100, -25)">
      <!-- Duck Body -->
      <ellipse cx="0" cy="5" rx="24" ry="16" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
      <path d="M 18 2 Q 28 -5 26 8 Z" fill="#fde047" stroke="#eab308" stroke-width="1.5" /> <!-- Tail -->
      <!-- Duck Head -->
      <circle cx="-12" cy="-10" r="14" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
      <!-- Beak -->
      <polygon points="-24,-8 -34,-5 -24,-2" fill="#f97316" />
      <!-- Eye -->
      <circle cx="-15" cy="-13" r="2.5" fill="#1e1b4b" />
      <!-- "FLOAT" badge tag -->
      <rect x="-24" y="-36" width="48" height="16" rx="8" fill="#10b981" />
      <text x="0" y="-24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle">FLOAT ⬆</text>
    </g>

    <!-- FLOATING OBJECT 2: Green Cell Sponge floating on surface -->
    <g transform="translate(20, -18)">
      <rect x="-25" y="0" width="50" height="20" rx="4" fill="#84cc16" stroke="#65a30d" stroke-width="1.5" />
      <circle cx="-12" cy="8" r="2.5" fill="#4d7c0f" opacity="0.6" />
      <circle cx="2" cy="12" r="3" fill="#4d7c0f" opacity="0.6" />
      <circle cx="14" cy="6" r="2" fill="#4d7c0f" opacity="0.6" />
    </g>

    <!-- SINKING OBJECT: Metal Teaspoon Resting at the Bottom of Basin -->
    <g transform="translate(-20, 50)">
      <!-- Spoon Bowl -->
      <ellipse cx="-45" cy="0" rx="14" ry="9" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Spoon Handle -->
      <rect x="-35" y="-3" width="70" height="6" rx="3" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(8 0 0)" />
      <!-- "SINK" badge tag -->
      <rect x="5" y="-22" width="44" height="16" rx="8" fill="#ef4444" />
      <text x="27" y="-10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle">SINK ⬇</text>
    </g>

    <!-- Pouring Measuring Cup on Right -->
    <g transform="translate(125, -45) rotate(-25)">
      <rect x="-25" y="-15" width="50" height="42" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
      <path d="M 25 -5 Q 40 5 25 15" fill="none" stroke="#38bdf8" stroke-width="3" /> <!-- Cup Handle -->
      <line x1="-20" y1="-5" x2="-8" y2="-5" stroke="#0284c7" stroke-width="2" />
      <line x1="-20" y1="5" x2="-4" y2="5" stroke="#0284c7" stroke-width="2" />
      <line x1="-20" y1="15" x2="-8" y2="15" stroke="#0284c7" stroke-width="2" />
      <!-- Water pour stream -->
      <path d="M -25 20 Q -45 50 -35 75" fill="none" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Shiny Water Bubbles -->
    <circle cx="60" cy="18" r="6" fill="#e0f2fe" opacity="0.75" />
    <circle cx="-50" cy="22" r="5" fill="#e0f2fe" opacity="0.65" />
    <circle cx="100" cy="35" r="7" fill="#e0f2fe" opacity="0.8" />
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Kitchen Sink Toddler STEM</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Floating Sponges · Sinking Spoons · Density &amp; Bubbles Science</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#38bdf8" />
    </g>
  </g>
</svg>
