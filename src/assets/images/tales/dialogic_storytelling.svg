<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Playful Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="160" fill="#fed7aa" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#fed7aa" opacity="0.1" filter="blur(50px)" />

  <!-- Category Pill Badge at Top Left -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fed7aa" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fed7aa" letter-spacing="2">LEARNING</text>
  </g>

  <!-- Visual Central Illustration -->
  <g filter="url(#shadow)">
    
      <circle cx="400" cy="175" r="90" fill="url(#sunGlow)" opacity="0.25" />
      <!-- Open Magic Storybook -->
      <path d="M 400 220 L 310 240 Q 300 160 310 140 L 400 155 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <path d="M 400 220 L 490 240 Q 500 160 490 140 L 400 155 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
      <line x1="400" y1="155" x2="400" y2="225" stroke="#94a3b8" stroke-width="3" />
      <!-- Colorful Illustrations on Pages -->
      <circle cx="355" cy="175" r="14" fill="#3b82f6" />
      <rect x="335" y="198" width="40" height="6" rx="3" fill="#cbd5e1" />
      <rect x="335" y="210" width="30" height="6" rx="3" fill="#cbd5e1" />
      <circle cx="445" cy="175" r="14" fill="#ec4899" />
      <rect x="425" y="198" width="40" height="6" rx="3" fill="#cbd5e1" />
      <rect x="425" y="210" width="30" height="6" rx="3" fill="#cbd5e1" />
      <!-- Magic Sparkles Bursting -->
      <polygon points="400,100 403,115 418,118 406,126 409,141 397,131 385,138 390,124 380,115 394,114" fill="#facc15" />
    
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    
    <!-- Title -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Interactive Dialogic Reading</text>
    
    <!-- Tagline / Subtitle -->
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">&quot;Where Is the Puppy?&quot; · Pausing for Child Voice &amp; Interaction</text>

    <!-- Star verified badge at right -->
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fed7aa" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fed7aa" />
    </g>
  </g>
</svg>
