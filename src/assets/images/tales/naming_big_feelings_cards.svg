<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#f472b6" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#f472b6" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#f472b6" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#f472b6" letter-spacing="2">TANTRUMS</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Emotion Cards with expressions (Happy, Frustrated, Calm) -->
    <!-- Card 1: Happy -->
    <g transform="translate(300, 160)">
      <rect x="-35" y="-45" width="70" height="90" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="2.5" />
      <circle cx="0" cy="-10" r="16" fill="#facc15" />
      <circle cx="-5" cy="-12" r="2" fill="#0f172a" />
      <circle cx="5" cy="-12" r="2" fill="#0f172a" />
      <path d="M -7 -6 Q 0 -1 7 -6" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#facc15">HAPPY</text>
    </g>
    <!-- Card 2: Frustrated / Angry -->
    <g transform="translate(400, 150)">
      <rect x="-38" y="-48" width="76" height="96" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="3" />
      <circle cx="0" cy="-10" r="18" fill="#f43f5e" />
      <line x1="-8" y1="-15" x2="-2" y2="-12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="8" y1="-15" x2="2" y2="-12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M -8 -3 Q 0 -9 8 -3" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#f43f5e">UPSET</text>
    </g>
    <!-- Card 3: Calm -->
    <g transform="translate(500, 160)">
      <rect x="-35" y="-45" width="70" height="90" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2.5" />
      <circle cx="0" cy="-10" r="16" fill="#34d399" />
      <path d="M -8 -11 Q -5 -13 -2 -11" fill="none" stroke="#0f172a" stroke-width="2" />
      <path d="M 2 -11 Q 5 -13 8 -11" fill="none" stroke="#0f172a" stroke-width="2" />
      <path d="M -5 -5 Q 0 -3 5 -5" fill="none" stroke="#0f172a" stroke-width="2" />
      <text x="0" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#34d399">CALM</text>
    </g>
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Naming Big Feelings: Expanding Emotional Vocabulary</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Feelings Cards · Mirror Play · Turning Screams into Spoken Words</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#f472b6" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#f472b6" />
    </g>
  </g>
</svg>
