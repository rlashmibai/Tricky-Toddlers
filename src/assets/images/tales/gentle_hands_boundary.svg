<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <radialGradient id="gentleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#2dd4bf" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: Cupped Gentle Palms Holding a Delicate Butterfly & Boundary Shield -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Soft Protective Aura Circle -->
    <circle cx="0" cy="0" r="110" fill="url(#gentleGlow)" />
    <circle cx="0" cy="0" r="85" fill="#0f766e" opacity="0.3" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Left Gentle Palm Cupping Center -->
    <g transform="translate(-45, 10) rotate(-15)">
      <rect x="-30" y="-15" width="45" height="48" rx="12" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
      <rect x="-24" y="-45" width="9" height="36" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="-13" y="-52" width="9" height="42" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="-2" y="-48" width="9" height="38" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="9" y="-38" width="8" height="28" rx="4" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
    </g>

    <!-- Right Gentle Palm Cupping Center -->
    <g transform="translate(45, 10) rotate(15)">
      <rect x="-15" y="-15" width="45" height="48" rx="12" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
      <rect x="-17" y="-38" width="8" height="28" rx="4" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="-7" y="-48" width="9" height="38" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="4" y="-52" width="9" height="42" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="15" y="-45" width="9" height="36" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
    </g>

    <!-- Delicate Fluttering Butterfly Resting Between Palms -->
    <g transform="translate(0, -25)">
      <!-- Left Wings -->
      <path d="M 0 0 C -35 -30 -40 10 0 12 Z" fill="#f43f5e" stroke="#fda4af" stroke-width="1.5" />
      <path d="M 0 10 C -25 25 -30 35 0 20 Z" fill="#fb7185" />
      <!-- Right Wings -->
      <path d="M 0 0 C 35 -30 40 10 0 12 Z" fill="#f43f5e" stroke="#fda4af" stroke-width="1.5" />
      <path d="M 0 10 C 25 25 30 35 0 20 Z" fill="#fb7185" />
      <!-- Butterfly Body & Antennae -->
      <ellipse cx="0" cy="10" rx="3" ry="14" fill="#1e293b" />
      <path d="M -2 -4 Q -8 -16 -12 -14" fill="none" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 2 -4 Q 8 -16 12 -14" fill="none" stroke="#1e293b" stroke-width="1.5" />
      <!-- Yellow dots on wings -->
      <circle cx="-16" cy="-6" r="3" fill="#fef08a" />
      <circle cx="16" cy="-6" r="3" fill="#fef08a" />
    </g>

    <!-- Firm Gentle Boundary Ribbon Tag -->
    <rect x="-70" y="52" width="140" height="26" rx="8" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="0" y="69" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#5eead4" text-anchor="middle" letter-spacing="1">GENTLE TOUCH</text>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Gentle Hands &amp; Safe Touch</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Hands Are for Hugs · Firm Loving Boundaries · Impulse Control</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#2dd4bf" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#2dd4bf" />
    </g>
  </g>
</svg>
