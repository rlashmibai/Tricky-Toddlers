<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#fbbf24" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#6366f1" opacity="0.15" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fbbf24" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fbbf24" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Toddler Bed Frame & Safety Rail -->
    <rect x="310" y="170" width="180" height="50" rx="12" fill="#312e81" stroke="#fbbf24" stroke-width="3" />
    <!-- Headboard -->
    <rect x="295" y="130" width="25" height="90" rx="8" fill="#4338ca" stroke="#fbbf24" stroke-width="2" />
    <!-- Cozy star pillow -->
    <ellipse cx="340" cy="180" rx="20" ry="12" fill="#ffffff" />
    <!-- Safety side guard rail -->
    <rect x="330" y="155" width="85" height="15" rx="6" fill="#f59e0b" />
    <!-- Bed posts -->
    <rect x="295" y="215" width="10" height="25" rx="3" fill="#fbbf24" />
    <rect x="480" y="215" width="10" height="25" rx="3" fill="#fbbf24" />
    <!-- Soft Dream Star & Crescent -->
    <g transform="translate(450, 125)">
      <circle cx="0" cy="0" r="18" fill="#fbbf24" opacity="0.2" />
      <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="#fbbf24" />
    </g>
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Crib to Toddler Bed Transition: Signs of Readiness</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Impulse Control · Safe Bedroom Gates · Gentle Timing at Age 3</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fbbf24" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fbbf24" />
    </g>
  </g>
</svg>
