<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31102b" />
      <stop offset="100%" stop-color="#140410" />
    </linearGradient>
    <linearGradient id="upstairsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="downstairsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb7185" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb7185" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Central Thematic Illustration: Upstairs Brain (Prefrontal) vs Downstairs Brain (Amygdala) -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Brain Silhouette Outer Shell -->
    <path d="M -110 30 C -140 10 -130 -60 -80 -80 C -30 -100 60 -100 100 -60 C 140 -20 130 50 80 65 C 50 75 10 75 -20 60 C -60 70 -90 50 -110 30 Z" fill="#1e1b4b" stroke="#f472b6" stroke-width="3" />

    <!-- Upstairs Brain (Top Half - Prefrontal Cortex: Logic, Language, Impulse Control) -->
    <path d="M -80 -80 C -30 -100 60 -100 100 -60 C 120 -40 110 -10 70 -5 C 20 0 -30 0 -70 -10 C -95 -20 -105 -50 -80 -80 Z" fill="url(#upstairsGrad)" opacity="0.9" stroke="#bae6fd" stroke-width="2" />
    <!-- Logic Puzzle Piece Icon Inside Upstairs Brain -->
    <g transform="translate(0, -45)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="-12" r="5" fill="#f8fafc" />
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#0284c7" text-anchor="middle">LOGIC</text>
    </g>

    <!-- Downstairs Brain (Lower Half - Amygdala: Survival, Alarm, Big Raw Emotion) -->
    <path d="M -70 -5 C -30 5 20 5 70 0 C 100 20 85 55 50 65 C 10 75 -30 65 -65 45 C -85 25 -85 10 -70 -5 Z" fill="url(#downstairsGrad)" opacity="0.9" stroke="#fca5a5" stroke-width="2" />
    <!-- Amygdala Alarm Fire / Siren Icon Inside Downstairs Brain -->
    <g transform="translate(0, 30)">
      <circle cx="0" cy="0" r="16" fill="#fef08a" stroke="#ef4444" stroke-width="2" />
      <polygon points="0,-12 3,-4 11,-4 5,1 7,9 0,4 -7,9 -5,1 -11,-4 -3,-4" fill="#ef4444" />
      <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="7" fill="#fecdd3" text-anchor="middle">AMYGDALA</text>
    </g>

    <!-- Brain Dividing Staircase / Ladder Line -->
    <line x1="-90" y1="-5" x2="90" y2="-5" stroke="#fde047" stroke-width="3" stroke-dasharray="6 4" />

    <!-- Upstairs Label Card on Left -->
    <g transform="translate(-160, -45)">
      <rect x="-45" y="-14" width="90" height="28" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#e0f2fe" text-anchor="middle">UPSTAIRS: LOGIC</text>
    </g>

    <!-- Downstairs Label Card on Right -->
    <g transform="translate(160, 30)">
      <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#991b1b" stroke="#f87171" stroke-width="1.5" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fee2e2" text-anchor="middle">DOWNSTAIRS: ALARM</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Decoding Toddler Meltdowns</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Amygdala Alarm vs Logic · The Brain in an Emotional Storm</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb7185" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb7185" />
    </g>
  </g>
</svg>
