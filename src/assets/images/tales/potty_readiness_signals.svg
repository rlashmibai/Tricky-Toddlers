<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#38bdf8" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">POTTY TRAINING</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Readiness Signals Board with Checklist & 2h Dry Clock -->
    <g transform="translate(320, 160)">
      <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
      <!-- Clock hands showing 2 hours dry nap -->
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="0" x2="16" y2="8" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#facc15" />
      <text x="0" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#38bdf8">2-HR DRY NAP</text>
    </g>
    <!-- Readiness Checklist with Green Checks -->
    <g transform="translate(450, 155)">
      <rect x="-45" y="-45" width="90" height="90" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2.5" />
      <circle cx="-25" cy="-20" r="6" fill="#10b981" />
      <rect x="-12" y="-23" width="40" height="6" rx="3" fill="#e2e8f0" />
      <circle cx="-25" cy="0" r="6" fill="#10b981" />
      <rect x="-12" y="-3" width="40" height="6" rx="3" fill="#e2e8f0" />
      <circle cx="-25" cy="20" r="6" fill="#10b981" />
      <rect x="-12" y="17" width="40" height="6" rx="3" fill="#e2e8f0" />
      <text x="0" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#34d399">READY CUES</text>
    </g>
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Signs of Readiness: Is It the Right Window?</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Dry Naps · Bladder Maturation · Following Simple Steps</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#38bdf8" />
    </g>
  </g>
</svg>
