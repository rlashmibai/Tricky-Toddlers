<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#fb923c" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#fb923c" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb923c" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb923c" letter-spacing="2">LEARNING</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Vibrant Geometric Shapes: Circle, Triangle, Square, Star -->
    <circle cx="310" cy="180" r="26" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <polygon points="370,150 345,200 395,200" fill="#facc15" stroke="#ffffff" stroke-width="3" />
    <rect x="410" y="155" width="45" height="45" rx="8" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <g transform="translate(490, 175)">
      <polygon points="0,-24 7,-7 24,-7 11,5 16,22 0,12 -16,22 -11,5 -24,-7 -7,-7" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
    </g>
    <!-- Scavenger hunt magnifying glass -->
    <g transform="translate(400, 110)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="4" />
      <line x1="14" y1="14" x2="28" y2="28" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Color &amp; Shape Recognition Through Household Games</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Active Scavenger Hunts · Sensory Shape Sorting · Physical Learning</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb923c" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb923c" />
    </g>
  </g>
</svg>
