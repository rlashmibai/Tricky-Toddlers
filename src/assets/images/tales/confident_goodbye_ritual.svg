<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient light -->
  <circle cx="400" cy="160" r="140" fill="#2dd4bf" opacity="0.12" filter="blur(45px)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#2dd4bf" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: The High-Five Goodbye Ritual, Toddler Backpack & Heart Kiss -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- High-Five Energy Burst Sparkles -->
    <circle cx="0" cy="-20" r="45" fill="#fef08a" opacity="0.15" />
    <circle cx="0" cy="-20" r="30" fill="#2dd4bf" opacity="0.2" />
    <polygon points="0,-45 4,-26 24,-26 8,-14 14,5 0,-7 -14,5 -8,-14 -24,-26 -4,-26" fill="#fde047" opacity="0.9" />

    <!-- Adult Gentle Hand on Left -->
    <g transform="translate(-65, -15)">
      <!-- Palm -->
      <rect x="-35" y="-30" width="45" height="55" rx="14" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
      <!-- Fingers reaching up/right -->
      <rect x="-30" y="-70" width="10" height="45" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="-18" y="-76" width="10" height="50" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="-6" y="-72" width="10" height="46" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <rect x="6" y="-62" width="9" height="38" rx="4.5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <!-- Thumb -->
      <path d="M 10 -15 C 22 -15 25 -32 15 -35 C 10 -35 8 -25 8 -15 Z" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <!-- Adult Sleeve -->
      <rect x="-55" y="25" width="65" height="45" rx="8" fill="#0284c7" />
    </g>

    <!-- Toddler Hand on Right (High-fiving the adult palm) -->
    <g transform="translate(65, -15)">
      <!-- Small Palm -->
      <rect x="-10" y="-20" width="34" height="42" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2" />
      <!-- Tiny Fingers -->
      <rect x="-8" y="-50" width="7" height="32" rx="3.5" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="-55" width="7.5" height="37" rx="3.5" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="9" y="-52" width="7" height="34" rx="3.5" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="18" y="-44" width="6.5" height="26" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" />
      <!-- Toddler Sleeve (Yellow striped) -->
      <rect x="-10" y="22" width="46" height="38" rx="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="-10" y1="34" x2="36" y2="34" stroke="#d97706" stroke-width="3" />
    </g>

    <!-- Cute Toddler Preschool Backpack on Far Right -->
    <g transform="translate(180, 20)">
      <rect x="-24" y="-35" width="48" height="55" rx="14" fill="#ec4899" stroke="#db2777" stroke-width="2" />
      <rect x="-16" y="-12" width="32" height="25" rx="6" fill="#f472b6" />
      <circle cx="0" cy="0" r="5" fill="#fde047" /> <!-- Star patch -->
      <!-- Shoulder straps -->
      <path d="M -18 -35 Q -32 -10 -22 15" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Pocket Hug Token / 2 Kisses Heart Tokens -->
    <g transform="translate(-160, 20)">
      <circle cx="0" cy="0" r="24" fill="#f43f5e" stroke="#fda4af" stroke-width="2" />
      <!-- Heart icon -->
      <path d="M 0 -8 C -7 -18 -18 -8 -10 2 L 0 12 L 10 2 C 18 -8 7 -18 0 -8 Z" fill="#ffffff" />
      <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#5eead4" text-anchor="middle">POCKET HUG</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Confident Goodbyes</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Easing Separation Anxiety · 2 Kisses &amp; High Five · Trust</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#99f6e4" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#99f6e4" />
    </g>
  </g>
</svg>
