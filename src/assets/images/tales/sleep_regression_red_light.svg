<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#0f0202" />
    </linearGradient>
    <radialGradient id="redLampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fbbf24" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fbbf24" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Central Thematic Illustration: The 650nm Red Ambient Nightlight Lamp & Circadian Melatonin Protection -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Cozy Cot / Toddler Bed on Left -->
    <g transform="translate(-110, 25)">
      <!-- Bed Headboard -->
      <rect x="-65" y="-45" width="12" height="90" rx="5" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <rect x="65" y="-20" width="10" height="65" rx="4" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <!-- Mattress & Bed Base -->
      <rect x="-55" y="5" width="120" height="38" rx="8" fill="#1e293b" />
      <!-- Soft Pillow & Sleeping Toddler -->
      <rect x="-50" y="-10" width="38" height="18" rx="8" fill="#f8fafc" />
      <circle cx="-35" cy="-2" r="10" fill="#fde68a" />
      <!-- Cozy Blanket with Warm Glow Reflection -->
      <path d="M -20 2 Q 10 -10 65 5 L 65 35 L -20 35 Z" fill="#991b1b" stroke="#ef4444" stroke-width="1.5" />
      <text x="40" y="-18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#fca5a5">z</text>
      <text x="52" y="-28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#fca5a5">Z</text>
    </g>

    <!-- Bedside Table on Right -->
    <g transform="translate(130, 25)">
      <!-- Nightstand Wood Table -->
      <rect x="-35" y="-5" width="70" height="50" rx="6" fill="#78350f" stroke="#92400e" stroke-width="2" />
      <rect x="-28" y="10" width="56" height="25" rx="4" fill="#451a03" />
      <circle cx="0" cy="22" r="3" fill="#fbbf24" />

      <!-- Red / Amber Nightlight Lamp on table -->
      <g transform="translate(0, -5)">
        <!-- Lamp Base & Stem -->
        <ellipse cx="0" cy="0" rx="18" ry="5" fill="#334155" />
        <rect x="-3" y="-30" width="6" height="30" rx="2" fill="#475569" />
        <!-- Lamp Shade (Glowing Warm Red 650nm) -->
        <polygon points="-26,-30 26,-30 16,-65 -16,-65" fill="#dc2626" stroke="#ef4444" stroke-width="2" />
        <!-- Glowing Red Halo Sphere surrounding lamp -->
        <circle cx="0" cy="-48" r="85" fill="url(#redLampGlow)" />
        <circle cx="0" cy="-48" r="12" fill="#fef08a" opacity="0.9" />
      </g>
    </g>

    <!-- Melatonin Protection Ribbon Tag Overhead -->
    <g transform="translate(0, -65)">
      <rect x="-95" y="0" width="190" height="28" rx="14" fill="#1c1917" stroke="#ef4444" stroke-width="2" />
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#fca5a5" text-anchor="middle" letter-spacing="1">650nm RED LIGHT · MELATONIN</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Overcoming 2-Year Regression</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Dim Red Nightlight · Melatonin Protection · Loving Routine</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fbbf24" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fbbf24" />
    </g>
  </g>
</svg>
