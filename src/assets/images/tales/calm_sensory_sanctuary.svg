<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021c1a" />
    </linearGradient>
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient soothing glow -->
  <circle cx="400" cy="160" r="150" fill="#2dd4bf" opacity="0.1" filter="blur(50px)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#2dd4bf" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: The Sensory Sanctuary Canopy Tent & Muffs -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Base rug -->
    <ellipse cx="0" cy="70" rx="190" ry="25" fill="#0f766e" opacity="0.4" stroke="#2dd4bf" stroke-width="2" />

    <!-- Play Teepee Tent / Canopy -->
    <!-- Wooden poles -->
    <line x1="-120" y1="70" x2="30" y2="-95" stroke="#fde68a" stroke-width="6" stroke-linecap="round" />
    <line x1="120" y1="70" x2="-30" y2="-95" stroke="#fde68a" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="70" x2="0" y2="-105" stroke="#fde68a" stroke-width="6" stroke-linecap="round" />

    <!-- Tent Fabric Shell -->
    <polygon points="0,-85 -110,65 110,65" fill="url(#tentGrad)" opacity="0.85" stroke="#5eead4" stroke-width="3" />
    <!-- Tent Open Flap (Peeking into cozy interior) -->
    <polygon points="0,-30 -40,65 40,65" fill="#042f2e" stroke="#2dd4bf" stroke-width="2" />

    <!-- Twinkling stars inside tent -->
    <circle cx="-12" cy="15" r="3.5" fill="#fef08a" />
    <circle cx="15" cy="25" r="2.5" fill="#fef08a" />
    <circle cx="0" cy="40" r="3" fill="#fef08a" />

    <!-- Weighted Sensory Blanket draped over side -->
    <path d="M -90 40 Q -70 20 -40 35 L -35 70 L -100 70 Z" fill="#6366f1" stroke="#a5b4fc" stroke-width="2" />
    <!-- Quilted squares pattern on weighted blanket -->
    <line x1="-80" y1="40" x2="-50" y2="70" stroke="#818cf8" stroke-width="1.5" />
    <line x1="-65" y1="35" x2="-35" y2="65" stroke="#818cf8" stroke-width="1.5" />

    <!-- Noise-Dampening Toddler Over-Ear Headphones on the right -->
    <g transform="translate(130, 25)">
      <!-- Headband -->
      <path d="M -22 0 A 22 22 0 0 1 22 0" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" />
      <!-- Left Ear Cup -->
      <rect x="-28" y="-4" width="12" height="24" rx="6" fill="#fb7185" stroke="#f43f5e" stroke-width="2" />
      <!-- Right Ear Cup -->
      <rect x="16" y="-4" width="12" height="24" rx="6" fill="#fb7185" stroke="#f43f5e" stroke-width="2" />
      <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#5eead4" text-anchor="middle">QUIET</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Sensory Reset Sanctuary</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Dimming Stimulation · Gentle Pressure · Calming Nervous Systems</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#2dd4bf" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#2dd4bf" />
    </g>
  </g>
</svg>
