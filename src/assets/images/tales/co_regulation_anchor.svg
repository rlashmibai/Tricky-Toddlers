<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#2e020d" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Playful Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="160" fill="#fda4af" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#fda4af" opacity="0.1" filter="blur(50px)" />

  <!-- Category Pill Badge at Top Left -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fda4af" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fda4af" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Visual Central Illustration -->
  <g filter="url(#shadow)">
    
      <circle cx="400" cy="180" r="95" fill="url(#sunGlow)" opacity="0.25" />
      <!-- Radiating Calm Rings -->
      <circle cx="400" cy="180" r="120" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />
      <circle cx="400" cy="180" r="80" fill="none" stroke="#fda4af" stroke-width="2" opacity="0.6" />
      <!-- Central Loving Heart -->
      <path d="M 400 140 C 370 90 320 120 350 170 C 370 200 400 230 400 230 C 400 230 430 200 450 170 C 480 120 430 90 400 140 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
      <!-- Calm Anchor Motif -->
      <circle cx="400" cy="155" r="10" fill="#ffffff" />
      <path d="M 385 185 Q 400 205 415 185" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    
    <!-- Title -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Co-Regulation: The Calm Anchor</text>
    
    <!-- Tagline / Subtitle -->
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Audible Slow Breaths · Soft Voice · Mirror Neurons of Peace</text>

    <!-- Star verified badge at right -->
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fda4af" />
    </g>
  </g>
</svg>
