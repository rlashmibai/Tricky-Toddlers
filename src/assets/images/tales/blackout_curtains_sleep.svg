<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="30%" stop-color="#312e81" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#facc15" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#facc15" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Central Thematic Illustration: Window with Deep Blackout Curtains, Thermometer & Sleep Clock -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Curtain Rod -->
    <rect x="-190" y="-105" width="380" height="10" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
    <circle cx="-190" cy="-100" r="10" fill="#f59e0b" />
    <circle cx="190" cy="-100" r="10" fill="#f59e0b" />

    <!-- Window Frame Behind -->
    <rect x="-140" y="-95" width="280" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <line x1="0" y1="-95" x2="0" y2="85" stroke="#334155" stroke-width="3" />
    <line x1="-140" y1="-5" x2="140" y2="-5" stroke="#334155" stroke-width="3" />

    <!-- Tiny peek of starry night outside window panes -->
    <circle cx="-60" cy="-50" r="2" fill="#fef08a" opacity="0.8" />
    <circle cx="70" cy="-60" r="2.5" fill="#fef08a" opacity="0.9" />
    <path d="M 90 -45 A 14 14 0 0 0 80 -25 A 14 14 0 1 1 90 -45 Z" fill="#fef08a" opacity="0.85" />

    <!-- Heavy Blackout Drapes (Left and Right Pleats) -->
    <!-- Left Curtain -->
    <path d="M -170 -95 L -10 -95 Q -25 0 -15 95 L -175 95 Z" fill="url(#curtainGrad)" stroke="#4338ca" stroke-width="2" />
    <path d="M -130 -95 Q -145 0 -135 95" stroke="#4f46e5" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M -90 -95 Q -105 0 -95 95" stroke="#4f46e5" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M -50 -95 Q -65 0 -55 95" stroke="#4f46e5" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Right Curtain -->
    <path d="M 10 -95 L 170 -95 L 175 95 L 15 95 Q 25 0 10 -95 Z" fill="url(#curtainGrad)" stroke="#4338ca" stroke-width="2" />
    <path d="M 50 -95 Q 65 0 55 95" stroke="#4f46e5" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M 90 -95 Q 105 0 95 95" stroke="#4f46e5" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M 130 -95 Q 145 0 135 95" stroke="#4f46e5" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Golden Tiebacks and Center Seal (100% Light Seal Badge) -->
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
    <path d="M -12 -12 L 12 12 M 12 -12 L -12 12" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="10" fill="#f59e0b" opacity="0.2" />
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">DARK</text>

    <!-- Side Nightstand Widget: Room Temp (20°C) & Clock (06:30 OK-to-wake) -->
    <g transform="translate(225, 10)">
      <rect x="-35" y="-45" width="70" height="75" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="-22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle">20°C</text>
      <text x="0" y="-8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">OPTIMAL</text>
      <line x1="-25" y1="2" x2="25" y2="2" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#4ade80" text-anchor="middle">ZZZ...</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Fixing 5:00 AM Early Wake-Ups</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">100% Blackout Curtains · 21°C Room Temp · Sound Masking</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#facc15" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#facc15" />
    </g>
  </g>
</svg>
