<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#84cc16" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#4ade80" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#4ade80" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: Outdoor Tree, Magnifying Glass, Ladybug on Leaf & Pinecone -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Natural forest ground mound -->
    <ellipse cx="0" cy="70" rx="220" ry="24" fill="#14532d" stroke="#22c55e" stroke-width="2" />

    <!-- Big Friendly Oak Tree on the Left -->
    <g transform="translate(-140, 0)">
      <!-- Tree Trunk -->
      <path d="M -15 70 Q -10 10 -20 -30 L 20 -30 Q 10 10 15 70 Z" fill="#78350f" stroke="#92400e" stroke-width="2" />
      <!-- Tree Canopy Leaves -->
      <circle cx="0" cy="-65" r="48" fill="#16a34a" />
      <circle cx="-35" cy="-50" r="38" fill="#22c55e" />
      <circle cx="35" cy="-50" r="38" fill="#22c55e" />
      <circle cx="0" cy="-35" r="42" fill="#15803d" />
    </g>

    <!-- Centerpiece: Toddler Magnifying Glass Inspecting Ladybug on Green Leaf -->
    <g transform="translate(0, 0)">
      <!-- Big Curved Oak / Maple Leaf -->
      <path d="M -60 25 C -50 -10 20 -30 65 15 C 40 40 -20 45 -60 25 Z" fill="#22c55e" stroke="#16a34a" stroke-width="2" />
      <line x1="-55" y1="24" x2="60" y2="16" stroke="#15803d" stroke-width="2" />
      <!-- Leaf veins -->
      <line x1="-20" y1="23" x2="-10" y2="8" stroke="#15803d" stroke-width="1.5" />
      <line x1="10" y1="21" x2="25" y2="6" stroke="#15803d" stroke-width="1.5" />

      <!-- Cute Little Red Ladybug on the leaf -->
      <g transform="translate(5, 12)">
        <ellipse cx="0" cy="0" rx="12" ry="10" fill="#ef4444" stroke="#dc2626" stroke-width="1" />
        <ellipse cx="-10" cy="0" rx="4" ry="4" fill="#1e1b4b" /> <!-- Head -->
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#1e1b4b" stroke-width="1.5" />
        <circle cx="-3" cy="-4" r="2" fill="#1e1b4b" />
        <circle cx="4" cy="-4" r="2" fill="#1e1b4b" />
        <circle cx="-3" cy="4" r="2" fill="#1e1b4b" />
        <circle cx="4" cy="4" r="2" fill="#1e1b4b" />
      </g>

      <!-- Magnifying Glass hovering directly over the ladybug -->
      <g transform="translate(15, -20) rotate(-25)">
        <!-- Handle -->
        <rect x="36" y="-6" width="55" height="12" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
        <!-- Lens Rim -->
        <circle cx="0" cy="0" r="38" fill="none" stroke="#fde047" stroke-width="6" />
        <!-- Glass Shimmer -->
        <circle cx="0" cy="0" r="35" fill="#38bdf8" opacity="0.25" />
        <path d="M -22 -20 Q 0 -35 22 -20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      </g>
    </g>

    <!-- Pinecone & Acorn on Far Right -->
    <g transform="translate(150, 40)">
      <!-- Brown Pinecone scales -->
      <ellipse cx="0" cy="0" rx="16" ry="24" fill="#78350f" stroke="#92400e" stroke-width="1.5" />
      <path d="M -12 -12 L 0 -5 L 12 -12 M -14 0 L 0 7 L 14 0 M -10 12 L 0 18 L 10 12" stroke="#d97706" stroke-width="2" fill="none" />
      <!-- Acorn -->
      <g transform="translate(-25, 10)">
        <ellipse cx="0" cy="5" rx="9" ry="12" fill="#b45309" />
        <ellipse cx="0" cy="-4" rx="11" ry="6" fill="#78350f" />
        <line x1="0" y1="-10" x2="0" y2="-4" stroke="#451a03" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The Genius of Nature Play</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Mud, Leaves &amp; Pinecones · Ankle Balance &amp; Immune Resilience</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#4ade80" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#4ade80" />
    </g>
  </g>
</svg>
