<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1222" />
      <stop offset="100%" stop-color="#140710" />
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient glow circles -->
  <circle cx="400" cy="140" r="140" fill="#f59e0b" opacity="0.12" filter="blur(40px)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb7185" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb7185" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Visual Central Illustration: Cupcake with 5 Candle Fingers and Gentle Breath Airflow -->
  <g filter="url(#shadow)" transform="translate(400, 185)">
    <!-- Plate -->
    <ellipse cx="0" cy="65" rx="150" ry="22" fill="#334155" stroke="#fb7185" stroke-width="3" opacity="0.85" />

    <!-- Cupcake Liner Base -->
    <path d="M -65 60 L -48 10 L 48 10 L 65 60 Z" fill="#ec4899" opacity="0.9" stroke="#fda4af" stroke-width="2" />
    <line x1="-30" y1="12" x2="-40" y2="58" stroke="#f472b6" stroke-width="2" />
    <line x1="0" y1="10" x2="0" y2="60" stroke="#f472b6" stroke-width="2" />
    <line x1="30" y1="12" x2="40" y2="58" stroke="#f472b6" stroke-width="2" />

    <!-- Cupcake Swirl Frosting -->
    <path d="M -70 12 C -80 -10 -40 -35 -10 -35 C 20 -35 70 -20 70 12 C 70 20 -70 20 -70 12 Z" fill="#fef08a" stroke="#fde047" stroke-width="3" />
    <ellipse cx="0" cy="-28" rx="35" ry="16" fill="#fef9c3" />
    <circle cx="0" cy="-38" r="10" fill="#f43f5e" /> <!-- Cherry on top -->

    <!-- 5 Birthday Candles representing the 5 fingers -->
    <!-- Candle 1 -->
    <rect x="-85" y="-55" width="10" height="50" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <!-- Candle 2 -->
    <rect x="-45" y="-70" width="10" height="50" rx="3" fill="#a855f7" stroke="#7e22ce" stroke-width="1.5" />
    <!-- Candle 3 (Center) -->
    <rect x="-5" y="-80" width="10" height="42" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <!-- Candle 4 -->
    <rect x="35" y="-70" width="10" height="50" rx="3" fill="#10b981" stroke="#047857" stroke-width="1.5" />
    <!-- Candle 5 -->
    <rect x="75" y="-55" width="10" height="50" rx="3" fill="#fb7185" stroke="#e11d48" stroke-width="1.5" />

    <!-- Wicks and Flames -->
    <!-- Candle 3 (Still gently flickering flame) -->
    <line x1="0" y1="-80" x2="0" y2="-88" stroke="#475569" stroke-width="2" />
    <path d="M 0 -88 Q -8 -105 0 -115 Q 8 -105 0 -88 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="0" cy="-98" r="18" fill="url(#candleGlow)" />

    <!-- Candle 2 & 4 (Flickering down) -->
    <line x1="-40" y1="-70" x2="-40" y2="-78" stroke="#475569" stroke-width="2" />
    <path d="M -40 -78 Q -46 -90 -40 -98 Q -34 -90 -40 -78 Z" fill="#fbbf24" opacity="0.9" />

    <line x1="40" y1="-70" x2="40" y2="-78" stroke="#475569" stroke-width="2" />
    <path d="M 40 -78 Q 34 -90 40 -98 Q 46 -90 40 -78 Z" fill="#fbbf24" opacity="0.9" />

    <!-- Candle 1 & 5 (Wisps of smoke from blown-out candles) -->
    <path d="M -80 -55 Q -90 -75 -78 -90 Q -68 -105 -82 -120" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8" />
    <path d="M 80 -55 Q 90 -75 78 -90 Q 68 -105 82 -120" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.8" />

    <!-- Gentle Toddler Exhale Breath Wisps (Curved soothing breeze) -->
    <path d="M -180 -80 C -120 -85 -90 -60 -50 -75" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <path d="M -190 -65 C -130 -70 -100 -45 -60 -55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <circle cx="-50" cy="-75" r="4" fill="#bae6fd" />
    <circle cx="-60" cy="-55" r="3" fill="#bae6fd" />
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Birthday Candle Breathing</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Blow Out Five Finger Candles · Vagus Nerve Calming Game</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb7185" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb7185" />
    </g>
  </g>
</svg>
