<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31102b" />
      <stop offset="100%" stop-color="#120510" />
    </linearGradient>
    <radialGradient id="calmAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb7185" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb7185" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Central Thematic Illustration: Kneeling Parent at Eye-Level in Supermarket, Co-regulation Shield -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Store Floor Line -->
    <line x1="-240" y1="70" x2="240" y2="70" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Grocery Shopping Cart in background on far right -->
    <g transform="translate(170, 10)">
      <!-- Cart Wire Mesh Basket -->
      <polygon points="-35,-25 35,-25 25,25 -25,25" fill="none" stroke="#64748b" stroke-width="2" />
      <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#64748b" stroke-width="1.5" />
      <line x1="-27" y1="5" x2="27" y2="5" stroke="#64748b" stroke-width="1.5" />
      <!-- Cart Handle -->
      <rect x="-42" y="-30" width="8" height="20" rx="3" fill="#ef4444" />
      <!-- Cart Wheels -->
      <circle cx="-15" cy="35" r="7" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="20" cy="35" r="7" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    </g>

    <!-- Glowing Calming Co-regulation Bubble in Center -->
    <circle cx="-15" cy="0" r="105" fill="url(#calmAura)" />

    <!-- Kneeling Parent (Left side, down at child's exact eye height) -->
    <g transform="translate(-75, 10)">
      <!-- Kneeling legs and body -->
      <path d="M -40 60 L -15 20 L -15 -10 L -45 -10 L -55 30 Z" fill="#4338ca" stroke="#6366f1" stroke-width="2" />
      <!-- Parent Torso -->
      <rect x="-45" y="-35" width="35" height="45" rx="10" fill="#6366f1" />
      <!-- Parent Head (Eye to eye) -->
      <circle cx="-25" cy="-55" r="20" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
      <!-- Parent Hair -->
      <path d="M -45 -65 C -45 -80 -10 -80 -5 -60 Z" fill="#312e81" />
      <!-- Calm Eye / Gentle Expression -->
      <path d="M -16 -54 Q -12 -58 -8 -54" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
      <!-- Reassuring open hands at child shoulder height -->
      <rect x="-10" y="-15" width="25" height="10" rx="5" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
    </g>

    <!-- Toddler Facing Parent at Eye Level (Right side) -->
    <g transform="translate(45, 15)">
      <!-- Toddler Legs & Body -->
      <rect x="-15" y="10" width="10" height="45" rx="5" fill="#0284c7" />
      <rect x="5" y="10" width="10" height="45" rx="5" fill="#0284c7" />
      <rect x="-20" y="-20" width="40" height="38" rx="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
      <!-- Toddler Head -->
      <circle cx="0" cy="-45" r="18" fill="#fde68a" stroke="#f59e0b" stroke-width="2" />
      <!-- Toddler hair -->
      <path d="M -18 -55 C -18 -68 18 -68 18 -55 Z" fill="#78350f" />
      <!-- Toddler softening face listening -->
      <path d="M -6 -44 Q 0 -48 6 -44" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Eye-to-Eye Connection Beam / Calming Wave -->
    <path d="M -65 -45 Q -15 -35 30 -35" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="4 4" />

    <!-- "EYE LEVEL · STEADY ANCHOR" Badge -->
    <g transform="translate(-15, -75)">
      <rect x="-80" y="0" width="160" height="26" rx="13" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
      <text x="0" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#5eead4" text-anchor="middle" letter-spacing="1">KNEEL TO EYE LEVEL</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Public Tantrum Grace</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Supermarket Calm · Forgetting Strangers · Steady Loving Boundary</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb7185" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb7185" />
    </g>
  </g>
</svg>
