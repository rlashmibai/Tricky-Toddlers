<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#34d399" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#34d399" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#34d399" letter-spacing="2">MEALTIME</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Transition from Bottle to Open Cup / Straw Cup -->
    <!-- Open Silicone Cup with Handles -->
    <g transform="translate(350, 140)">
      <path d="M 15 20 L 25 80 Q 50 90 75 80 L 85 20 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
      <path d="M 23 45 Q 50 55 77 45" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" />
      <!-- Left & Right handles -->
      <path d="M 15 30 Q -5 50 18 70" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
      <path d="M 85 30 Q 105 50 82 70" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    </g>
    <!-- Water Splashes & Healthy Dental Smile -->
    <circle cx="400" cy="115" r="7" fill="#38bdf8" />
    <circle cx="420" cy="125" r="5" fill="#38bdf8" />
    <!-- Dental Icon -->
    <g transform="translate(480, 160)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#34d399" stroke-width="2.5" />
      <!-- Tooth spark -->
      <path d="M -8 -8 C -12 -2 -12 8 -6 12 C -2 14 -2 6 0 6 C 2 6 2 14 6 12 C 12 8 12 -2 8 -8 C 4 -12 -4 -12 -8 -8 Z" fill="#ffffff" />
    </g>
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Open Cups &amp; Sippy Cups: Ditching the Bottle</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Dental Protection · Straw Cups · Oral Motor Articulation</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#34d399" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#34d399" />
    </g>
  </g>
</svg>
