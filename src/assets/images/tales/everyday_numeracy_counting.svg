<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#fb923c" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#fb923c" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb923c" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb923c" letter-spacing="2">LEARNING</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- 1, 2, 3, 4 Counting Staircase & Friendly Numbers -->
    <rect x="290" y="210" width="50" height="40" rx="6" fill="#0284c7" />
    <text x="315" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff">1</text>

    <rect x="345" y="180" width="50" height="70" rx="6" fill="#10b981" />
    <text x="370" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff">2</text>

    <rect x="400" y="150" width="50" height="100" rx="6" fill="#f59e0b" />
    <text x="425" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff">3</text>

    <rect x="455" y="120" width="50" height="130" rx="6" fill="#f43f5e" />
    <text x="480" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff">4</text>

    <!-- Star celebration at the top -->
    <polygon points="480,92 483,100 491,100 485,105 487,113 480,108 473,113 475,105 469,100 477,100" fill="#facc15" />
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Everyday Numeracy: Counting Stairs, Socks &amp; Snacks</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">1-2-3-4 Stairs · Matching Sock Pairs · Intuitive Math in Daily Routines</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb923c" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb923c" />
    </g>
  </g>
</svg>
