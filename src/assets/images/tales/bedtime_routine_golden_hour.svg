<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0e26" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Playful Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="160" fill="#facc15" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#facc15" opacity="0.1" filter="blur(50px)" />

  <!-- Category Pill Badge at Top Left -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#facc15" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#facc15" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Visual Central Illustration -->
  <g filter="url(#shadow)">
    
      <circle cx="400" cy="170" r="95" fill="url(#sunGlow)" opacity="0.3" />
      <!-- Glowing Crescent Moon -->
      <path d="M 370 100 A 65 65 0 0 0 445 225 A 50 50 0 1 1 370 100 Z" fill="#facc15" stroke="#fef08a" stroke-width="2" />
      <!-- Golden Stars -->
      <polygon points="320,110 324,120 335,121 327,128 329,139 320,133 311,139 313,128 305,121 316,120" fill="#fef08a" />
      <polygon points="460,120 463,127 471,128 465,133 467,141 460,136 453,141 455,133 449,128 457,127" fill="#fef08a" />
      <polygon points="430,70 432,75 438,76 433,80 435,86 430,82 425,86 427,80 422,76 428,75" fill="#fef08a" />
      <!-- Sleepy Cloud -->
      <path d="M 340 230 Q 340 210 360 210 Q 370 190 400 190 Q 430 190 440 210 Q 460 210 460 230 Z" fill="#ffffff" opacity="0.25" />
    
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    
    <!-- Title -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The Bedtime Golden Hour</text>
    
    <!-- Tagline / Subtitle -->
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Warm Bath · Dim Lights · 2 Storybooks · Sweet Lullabies</text>

    <!-- Star verified badge at right -->
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#facc15" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#facc15" />
    </g>
  </g>
</svg>
