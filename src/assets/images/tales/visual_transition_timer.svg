<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31102b" />
      <stop offset="100%" stop-color="#140510" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb7185" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb7185" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Central Thematic Illustration: Visual Countdown Disk Timer & Sand Hourglass -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Base Table Surface -->
    <ellipse cx="0" cy="70" rx="210" ry="20" fill="#1e1b4b" stroke="#475569" stroke-width="2" />

    <!-- Centerpiece: Visual Time Timer (Red Disc Countdown) -->
    <g transform="translate(-40, 5)">
      <!-- Timer Square Housing -->
      <rect x="-65" y="-65" width="130" height="130" rx="22" fill="#0f172a" stroke="#fb7185" stroke-width="3" />
      <!-- Dial Face -->
      <circle cx="0" cy="0" r="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
      <!-- Minute Tick Marks -->
      <line x1="0" y1="-48" x2="0" y2="-42" stroke="#1e293b" stroke-width="2" />
      <line x1="48" y1="0" x2="42" y2="0" stroke="#1e293b" stroke-width="2" />
      <line x1="0" y1="48" x2="0" y2="42" stroke="#1e293b" stroke-width="2" />
      <line x1="-48" y1="0" x2="-42" y2="0" stroke="#1e293b" stroke-width="2" />
      <!-- Red Time Pie Wedge (Counting down last 5-10 minutes) -->
      <path d="M 0 0 L 0 -45 A 45 45 0 0 1 35 -28 Z" fill="#ef4444" opacity="0.9" stroke="#dc2626" stroke-width="1" />
      <!-- Center knob -->
      <circle cx="0" cy="0" r="8" fill="#1e293b" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
      <!-- 5 MIN TAG -->
      <rect x="-30" y="-85" width="60" height="20" rx="10" fill="#ef4444" />
      <text x="0" y="-72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">5 MINS LEFT</text>
    </g>

    <!-- Visual Sand Hourglass on Right -->
    <g transform="translate(130, 5)">
      <!-- Wood caps (top & bottom) -->
      <rect x="-30" y="-65" width="60" height="10" rx="4" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <rect x="-30" y="45" width="60" height="10" rx="4" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
      <!-- Side poles -->
      <line x1="-24" y1="-55" x2="-24" y2="45" stroke="#f59e0b" stroke-width="3" />
      <line x1="24" y1="-55" x2="24" y2="45" stroke="#f59e0b" stroke-width="3" />
      <!-- Glass Bulbs (Upper & Lower) -->
      <path d="M -20 -55 C -20 -20 -4 -5 0 0 C 4 -5 20 -20 20 -55 Z" fill="#38bdf8" opacity="0.25" stroke="#bae6fd" stroke-width="2" />
      <path d="M -20 45 C -20 10 -4 -5 0 0 C 4 -5 20 10 20 45 Z" fill="#38bdf8" opacity="0.25" stroke="#bae6fd" stroke-width="2" />
      <!-- Golden Sand flowing down -->
      <polygon points="-12,-20 12,-20 0,-2" fill="#fde047" /> <!-- Top sand trickling -->
      <line x1="0" y1="0" x2="0" y2="28" stroke="#fde047" stroke-width="2" stroke-dasharray="2 2" />
      <path d="M -16 45 Q 0 25 16 45 Z" fill="#fde047" /> <!-- Bottom sand mound -->
      <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fde047" text-anchor="middle">SAND TIMER</text>
    </g>

    <!-- Peaceful Transition Bridge on Left -->
    <g transform="translate(-160, 20)">
      <!-- Park Swing / Slide icon -->
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <path d="M -12 -12 L 0 12 L 12 -12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#bae6fd" text-anchor="middle">PARK TO HOME</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The 5-Minute Warning Timer</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Visual Sand Timers · Preventing Transition Shocks at Park</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fda4af" />
    </g>
  </g>
</svg>
