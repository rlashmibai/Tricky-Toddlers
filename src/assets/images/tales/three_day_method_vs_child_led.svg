<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#38bdf8" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">POTTY TRAINING</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- 3-Day Intensive Calendar vs Child-Led Path -->
    <g transform="translate(320, 160)">
      <rect x="-40" y="-45" width="80" height="85" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
      <rect x="-40" y="-45" width="80" height="24" rx="6" fill="#f59e0b" />
      <text x="0" y="-28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#0f172a">3 DAYS</text>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#facc15">★ ★ ★</text>
      <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#94a3b8">INTENSIVE</text>
    </g>
    <!-- Stepping Stones to Child-Led Progress -->
    <g transform="translate(470, 160)">
      <circle cx="-25" cy="15" r="14" fill="#0284c7" />
      <circle cx="5" cy="-5" r="16" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <circle cx="35" cy="-25" r="18" fill="#10b981" />
      <polygon points="35,-33 37,-27 43,-27 38,-23 40,-17 35,-21 30,-17 32,-23 27,-27 33,-27" fill="#ffffff" />
      <text x="5" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#38bdf8">CHILD-LED</text>
    </g>
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The 3-Day Method vs Child-Led Training</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Comparing Intensive Naked Training with Gentle Child-Led Familiarity</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#38bdf8" />
    </g>
  </g>
</svg>
