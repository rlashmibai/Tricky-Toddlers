<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#190208" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb7185" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb7185" letter-spacing="2">TANTRUMS</text>
  </g>

  <!-- Central Thematic Illustration: Dual Scales / Balanced Pillars: Validating Feelings vs Holding Boundaries -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Central Balance Fulcrum / Beam -->
    <rect x="-180" y="25" width="360" height="12" rx="6" fill="#334155" stroke="#64748b" stroke-width="2" />
    <polygon points="0,25 -25,70 25,70" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="0" cy="25" r="8" fill="#fde047" />

    <!-- PILLAR 1 (Left): "I SEE YOUR BIG FEELINGS" (Warm Empathy Heart & Open Listening Ear) -->
    <g transform="translate(-110, -25)">
      <!-- Card Frame -->
      <rect x="-65" y="-55" width="130" height="95" rx="16" fill="#1e1b4b" stroke="#f43f5e" stroke-width="2.5" />
      <!-- Empathy Icon: Open Warm Heart with Soft Radiance -->
      <path d="M 0 -25 C -15 -42 -38 -20 -15 8 L 0 22 L 15 8 C 38 -20 15 -42 0 -25 Z" fill="#f43f5e" stroke="#fda4af" stroke-width="2" />
      <circle cx="0" cy="-3" r="5" fill="#ffffff" />
      <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fbcfe8" text-anchor="middle">1. VALIDATE FEELING</text>
      <!-- Subtitle -->
      <text x="0" y="-62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#fda4af" text-anchor="middle">&quot;IT'S OKAY TO BE MAD&quot;</text>
    </g>

    <!-- PILLAR 2 (Right): "I WILL KEEP US SAFE" (Firm Solid Boundary Shield & Holding Limit) -->
    <g transform="translate(110, -25)">
      <!-- Card Frame -->
      <rect x="-65" y="-55" width="130" height="95" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Boundary Icon: Solid Knight Shield with Gentle Open Hand -->
      <path d="M 0 -35 L 28 -20 L 28 8 C 28 26 0 38 0 38 C 0 38 -28 26 -28 8 L -28 -20 Z" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
      <!-- Gentle Palm inside shield -->
      <rect x="-8" y="-12" width="16" height="18" rx="4" fill="#ffffff" />
      <rect x="-7" y="-22" width="3.5" height="11" rx="1.5" fill="#ffffff" />
      <rect x="-2" y="-24" width="4" height="13" rx="2" fill="#ffffff" />
      <rect x="3.5" y="-21" width="3.5" height="10" rx="1.5" fill="#ffffff" />
      <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#bae6fd" text-anchor="middle">2. HOLD BOUNDARY</text>
      <text x="0" y="-62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#7dd3fc" text-anchor="middle">&quot;I WON'T LET YOU HIT&quot;</text>
    </g>

    <!-- Balance Plus Sign in Center -->
    <g transform="translate(0, -20)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#fde047" stroke-width="2" />
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Validate Feelings, Hold Limits</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">&quot;All Emotions Are Welcome ❤️ Harmful Actions Are Not&quot;</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#f43f5e" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#f43f5e" />
    </g>
  </g>
</svg>
