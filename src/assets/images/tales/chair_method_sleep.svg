<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fbbf24" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fbbf24" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Central Thematic Illustration: The Chair Method (Bed, Step-by-Step Chair Progression to Door) -->
  <g filter="url(#shadow)" transform="translate(400, 185)">
    <!-- Floor line -->
    <line x1="-240" y1="70" x2="240" y2="70" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Toddler Bed on the Left -->
    <g transform="translate(-150, 20)">
      <!-- Headboard -->
      <rect x="-65" y="-55" width="14" height="105" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2" />
      <!-- Footboard -->
      <rect x="65" y="-30" width="12" height="80" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="2" />
      <!-- Mattress & Bed Frame -->
      <rect x="-55" y="0" width="125" height="45" rx="8" fill="#3b82f6" />
      <rect x="-52" y="-12" width="38" height="20" rx="8" fill="#f8fafc" /> <!-- Pillow -->
      <!-- Sleeping toddler sleeping blanket -->
      <path d="M -20 -4 Q 10 -15 65 0 L 65 40 L -20 40 Z" fill="#60a5fa" stroke="#93c5fd" stroke-width="1.5" />
      <!-- Zzz floating -->
      <text x="-15" y="-30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#fef08a">z</text>
      <text x="0" y="-42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#fef08a">Z</text>
      <text x="20" y="-56" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#fef08a">Z</text>
    </g>

    <!-- Progression Path with Dashed Dots and Arrows -->
    <path d="M -50 45 C 0 30 50 30 110 45" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6" />
    <polygon points="112,45 104,39 104,51" fill="#fbbf24" />

    <!-- Step 1 Chair (Next to Bed - solid and present) -->
    <g transform="translate(-40, 20)">
      <rect x="-16" y="-30" width="6" height="50" rx="3" fill="#fbbf24" />
      <rect x="-16" y="5" width="32" height="6" rx="3" fill="#fbbf24" />
      <line x1="-14" y1="11" x2="-14" y2="50" stroke="#f59e0b" stroke-width="3" />
      <line x1="12" y1="11" x2="12" y2="50" stroke="#f59e0b" stroke-width="3" />
      <!-- Day 1-3 Badge -->
      <rect x="-24" y="-55" width="48" height="18" rx="9" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
      <text x="0" y="-42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#fbbf24" text-anchor="middle">DAY 1-3</text>
    </g>

    <!-- Step 2 Chair (Mid-room - gentle progression) -->
    <g transform="translate(45, 20)">
      <rect x="-16" y="-30" width="6" height="50" rx="3" fill="#fbbf24" opacity="0.6" />
      <rect x="-16" y="5" width="32" height="6" rx="3" fill="#fbbf24" opacity="0.6" />
      <line x1="-14" y1="11" x2="-14" y2="50" stroke="#f59e0b" stroke-width="3" opacity="0.6" />
      <line x1="12" y1="11" x2="12" y2="50" stroke="#f59e0b" stroke-width="3" opacity="0.6" />
      <rect x="-24" y="-55" width="48" height="18" rx="9" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" opacity="0.8" />
      <text x="0" y="-42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#fbbf24" text-anchor="middle">DAY 4-7</text>
    </g>

    <!-- Step 3 Chair (At Bedroom Door - independent milestone) -->
    <g transform="translate(140, 20)">
      <rect x="-16" y="-30" width="6" height="50" rx="3" fill="#4ade80" />
      <rect x="-16" y="5" width="32" height="6" rx="3" fill="#4ade80" />
      <line x1="-14" y1="11" x2="-14" y2="50" stroke="#22c55e" stroke-width="3" />
      <line x1="12" y1="11" x2="12" y2="50" stroke="#22c55e" stroke-width="3" />
      <rect x="-26" y="-55" width="52" height="18" rx="9" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
      <text x="0" y="-42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#4ade80" text-anchor="middle">AT DOOR</text>
    </g>

    <!-- Open Bedroom Door on far right -->
    <g transform="translate(205, -25)">
      <rect x="0" y="0" width="45" height="95" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <circle cx="8" cy="50" r="3" fill="#fde047" /> <!-- Door handle -->
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The Chair Method Transition</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Gradual Independent Sleep · Loving Presence · Zero Tears</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fbbf24" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fbbf24" />
    </g>
  </g>
</svg>
