<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="180" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="180" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">POTTY TRAINING</text>
  </g>

  <!-- Central Thematic Illustration: The Travel Potty Kit (Folding Seat, Wet Bag, Post-it Sensor Hack) -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Base Travel Duffel / Mat -->
    <ellipse cx="0" cy="65" rx="210" ry="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />

    <!-- Compact Folding Travel Potty in Center -->
    <g transform="translate(-10, 15)">
      <!-- Oval Seat Rim -->
      <ellipse cx="0" cy="-10" rx="65" ry="40" fill="#f8fafc" stroke="#38bdf8" stroke-width="3" />
      <ellipse cx="0" cy="-10" rx="36" ry="22" fill="#0284c7" />
      <!-- Folding Legs on sides (Green rubber grip feet) -->
      <path d="M -50 -5 L -65 35" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
      <path d="M 50 -5 L 65 35" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
      <ellipse cx="-65" cy="35" rx="8" ry="4" fill="#047857" />
      <ellipse cx="65" cy="35" rx="8" ry="4" fill="#047857" />
      <!-- Center Potty Bowl Liner -->
      <ellipse cx="0" cy="5" rx="28" ry="16" fill="#e0f2fe" opacity="0.8" />
      <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#bae6fd" text-anchor="middle">FOLDING TRAVEL SEAT</text>
    </g>

    <!-- Outing Kit Items: Post-It Note for Auto Flush Restroom Sensors on Left -->
    <g transform="translate(-150, -10) rotate(-10)">
      <rect x="-30" y="-30" width="60" height="60" rx="4" fill="#fef08a" stroke="#facc15" stroke-width="2" />
      <!-- Hand-written tip on Post-it note -->
      <text x="0" y="-12" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#854d0e" text-anchor="middle">POST-IT</text>
      <text x="0" y="2" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="#a16207" text-anchor="middle">COVERS AUTO</text>
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="#a16207" text-anchor="middle">FLUSH SENSOR</text>
      <!-- Red circle icon -->
      <circle cx="20" cy="-20" r="4" fill="#ef4444" />
    </g>

    <!-- Zip Travel Wet Bag & Wipes Pack on Right -->
    <g transform="translate(150, 0)">
      <!-- Waterproof Zippered Pouch -->
      <rect x="-35" y="-35" width="70" height="60" rx="10" fill="#f43f5e" stroke="#fda4af" stroke-width="2" />
      <line x1="-35" y1="-22" x2="35" y2="-22" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2" />
      <circle cx="-25" cy="-22" r="3" fill="#ffffff" /> <!-- Zipper pull -->
      <!-- Wipes Dispenser Box peeking -->
      <rect x="-20" y="5" width="40" height="24" rx="6" fill="#38bdf8" />
      <ellipse cx="0" cy="17" rx="10" ry="5" fill="#f8fafc" />
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fda4af" text-anchor="middle">WET BAG</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Potty Training on the Go</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Folding Car Potty · Post-It Note for Auto Sensors · Outing Kits</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#bae6fd" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#bae6fd" />
    </g>
  </g>
</svg>
