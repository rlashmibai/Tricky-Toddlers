<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fb923c" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fb923c" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: Puppy Being Gently Petted & Plant Being Watered -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Base lawn / room floor -->
    <ellipse cx="0" cy="70" rx="210" ry="24" fill="#15803d" opacity="0.4" stroke="#22c55e" stroke-width="2" />

    <!-- Cute Golden Puppy on the Left -->
    <g transform="translate(-110, 15)">
      <!-- Body -->
      <ellipse cx="10" cy="20" rx="42" ry="28" fill="#d97706" stroke="#b45309" stroke-width="2" />
      <!-- Wagging tail -->
      <path d="M 45 10 Q 75 0 65 -15" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
      <!-- Paws -->
      <ellipse cx="-15" cy="45" rx="12" ry="8" fill="#d97706" />
      <ellipse cx="25" cy="45" rx="12" ry="8" fill="#d97706" />
      <!-- Head -->
      <circle cx="-25" cy="-5" r="28" fill="#d97706" stroke="#b45309" stroke-width="2" />
      <!-- Floppy Ear Left -->
      <path d="M -45 -15 Q -60 15 -42 20 Q -32 5 -38 -15 Z" fill="#b45309" />
      <!-- Floppy Ear Right -->
      <path d="M -8 -15 Q 8 15 -10 20 Z" fill="#b45309" />
      <!-- Muzzle & Cute Nose -->
      <ellipse cx="-32" cy="5" rx="14" ry="10" fill="#fde68a" />
      <circle cx="-35" cy="0" r="5" fill="#1e1b4b" />
      <!-- Happy Smiling Mouth -->
      <path d="M -35 6 Q -30 12 -24 6" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
      <!-- Puppy Eye -->
      <circle cx="-20" cy="-10" r="3.5" fill="#1e1b4b" />

      <!-- Toddler Caring Hand Gently Stroking Puppy Back -->
      <g transform="translate(-15, -45)">
        <rect x="0" y="0" width="35" height="15" rx="7" fill="#fed7aa" stroke="#f97316" stroke-width="1.5" />
        <text x="18" y="-10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#fbbf24" text-anchor="middle">GENTLE</text>
      </g>
    </g>

    <!-- Growing Potted Seedling Plant in the Middle -->
    <g transform="translate(60, 25)">
      <!-- Terra Cotta Clay Pot -->
      <polygon points="-30,45 -22,0 22,0 30,45" fill="#ea580c" stroke="#c2410c" stroke-width="2" />
      <rect x="-26" y="-6" width="52" height="10" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1.5" />
      <!-- Soil -->
      <ellipse cx="0" cy="-1" rx="20" ry="5" fill="#451a03" />
      <!-- Green Stem and Leaves -->
      <path d="M 0 0 Q -5 -25 0 -45" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
      <!-- Leaf 1 (Left) -->
      <path d="M 0 -25 C -25 -35 -20 -15 0 -20 Z" fill="#4ade80" stroke="#16a34a" stroke-width="1.5" />
      <!-- Leaf 2 (Right) -->
      <path d="M 0 -35 C 25 -45 20 -25 0 -30 Z" fill="#4ade80" stroke="#16a34a" stroke-width="1.5" />
      <!-- Sprouting Little Flower / Top Bud -->
      <circle cx="0" cy="-48" r="6" fill="#facc15" stroke="#eab308" stroke-width="1.5" />
    </g>

    <!-- Cute Toddler Watering Can on Right -->
    <g transform="translate(160, -10)">
      <!-- Can Body -->
      <rect x="-25" y="0" width="50" height="42" rx="10" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
      <!-- Top Handle -->
      <path d="M -15 0 Q 0 -25 15 0" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
      <!-- Long Spout -->
      <path d="M -25 25 L -55 5" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
      <!-- Rose / Sprinkler Head -->
      <ellipse cx="-57" cy="3" rx="6" ry="10" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
      <!-- Water Droplets raining onto seedling -->
      <circle cx="-75" cy="18" r="3" fill="#bae6fd" />
      <circle cx="-85" cy="32" r="2.5" fill="#bae6fd" />
      <circle cx="-68" cy="42" r="3" fill="#bae6fd" />
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Raising Empathetic Toddlers</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Watering Houseplants · Gentle Hands with Family Pets · Kindness</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fb923c" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fb923c" />
    </g>
  </g>
</svg>
