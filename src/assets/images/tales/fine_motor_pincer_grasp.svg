<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b2b" />
      <stop offset="100%" stop-color="#041818" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#2dd4bf" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: Pincer Grasp (Thumb & Index Finger Pinching Bead) & Playdough Activity -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Wooden playboard surface -->
    <ellipse cx="0" cy="70" rx="220" ry="22" fill="#78350f" opacity="0.4" stroke="#d97706" stroke-width="1.5" />

    <!-- Wooden Peg Puzzle Board on Left -->
    <g transform="translate(-150, 15)">
      <rect x="-45" y="-35" width="90" height="70" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2" />
      <!-- Star cutout socket -->
      <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="#ca8a04" opacity="0.5" />
      <!-- Peg with little red ball knob -->
      <circle cx="0" cy="2" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    </g>

    <!-- Centerpiece: Toddler Hand Performing Anatomical Pincer Grasp -->
    <g transform="translate(0, -10)">
      <!-- Palm & Arm -->
      <rect x="40" y="20" width="70" height="38" rx="14" fill="#fde68a" stroke="#f59e0b" stroke-width="2" transform="rotate(-20 40 20)" />

      <!-- Forefinger / Index finger curling down to pinch -->
      <path d="M 45 5 C 30 -30 -10 -35 -20 -15 C -25 -2 -15 0 -8 0" fill="none" stroke="#fde68a" stroke-width="20" stroke-linecap="round" />
      <path d="M 45 5 C 30 -30 -10 -35 -20 -15 C -25 -2 -15 0 -8 0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

      <!-- Thumb curving up to meet index fingertip -->
      <path d="M 40 45 C 10 45 -18 35 -15 5 C -14 -2 -5 -2 -2 5" fill="none" stroke="#fde68a" stroke-width="22" stroke-linecap="round" />
      <path d="M 40 45 C 10 45 -18 35 -15 5 C -14 -2 -5 -2 -2 5" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

      <!-- Pinched Object: Vibrant Emerald Wooden Bead / Berry held firmly between pads -->
      <circle cx="-12" cy="0" r="14" fill="#10b981" stroke="#047857" stroke-width="2.5" />
      <circle cx="-16" cy="-4" r="4" fill="#a7f3d0" /> <!-- Shine reflection -->

      <!-- Sparkle of Mastery / Precision indicator -->
      <polygon points="-12,-26 -9,-17 0,-17 -7,-11 -4,-2 -12,-8 -20,-2 -17,-11 -24,-17 -15,-17" fill="#fde047" />
    </g>

    <!-- Homemade Atta / Playdough Ball with Little Rolling Pin on Right -->
    <g transform="translate(150, 20)">
      <!-- Playdough squished ball -->
      <ellipse cx="0" cy="15" rx="35" ry="24" fill="#ec4899" stroke="#db2777" stroke-width="2" />
      <!-- Small wooden rolling pin across -->
      <rect x="-45" y="-12" width="90" height="12" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" transform="rotate(-15 0 0)" />
      <!-- Handles -->
      <rect x="-60" y="-8" width="18" height="6" rx="2" fill="#d97706" transform="rotate(-15 0 0)" />
      <rect x="42" y="-8" width="18" height="6" rx="2" fill="#d97706" transform="rotate(-15 0 0)" />
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Fine Motor Pincer Grasp</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Atta Playdough · Tape Peeling · Finger Muscle Dexterity</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#5eead4" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#5eead4" />
    </g>
  </g>
</svg>
