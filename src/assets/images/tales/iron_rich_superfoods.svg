<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Playful Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="160" fill="#10b981" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#10b981" opacity="0.1" filter="blur(50px)" />

  <!-- Category Pill Badge at Top Left -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#10b981" letter-spacing="2">MEALTIME</text>
  </g>

  <!-- Visual Central Illustration -->
  <g filter="url(#shadow)">
    
      <circle cx="400" cy="180" r="95" fill="url(#sunGlow)" opacity="0.25" />
      <!-- Big Healthy Nutrition Bowl -->
      <ellipse cx="400" cy="225" rx="80" ry="45" fill="#0f172a" stroke="#10b981" stroke-width="4" />
      <!-- Wholesome Grains & Greens -->
      <ellipse cx="380" cy="210" rx="28" ry="18" fill="#d97706" /> <!-- Dal Khichdi -->
      <ellipse cx="420" cy="210" rx="24" ry="16" fill="#15803d" /> <!-- Spinach Puree -->
      <circle cx="400" cy="195" r="14" fill="#facc15" /> <!-- Lemon Wedge -->
      <path d="M 400 170 Q 405 160 410 170 Q 405 175 400 170 Z" fill="#22c55e" /> <!-- Mint leaf -->
      <!-- Iron Fe Badge -->
      <g transform="translate(400, 110)">
        <circle cx="0" cy="0" r="32" fill="#065f46" stroke="#10b981" stroke-width="3" />
        <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">Fe+</text>
      </g>
    
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    
    <!-- Title -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Iron-Rich Superfoods</text>
    
    <!-- Tagline / Subtitle -->
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Moong Dal · Sprouted Ragi · Spinach · Vitamin C Pairing</text>

    <!-- Star verified badge at right -->
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#10b981" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#10b981" />
    </g>
  </g>
</svg>
