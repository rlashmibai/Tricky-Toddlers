<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#2dd4bf" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#2dd4bf" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <!-- Central Thematic Illustration: Parallel Play (Toddler 1 with Block Tower, Toddler 2 with Train on Track) -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Interlocking Nursery Foam Tiles Mat -->
    <ellipse cx="0" cy="70" rx="220" ry="24" fill="#0f766e" opacity="0.5" stroke="#2dd4bf" stroke-width="2" />

    <!-- Toddler A Activity (Left): Colorful Wooden Stacking Blocks Tower -->
    <g transform="translate(-110, 0)">
      <!-- Toddler Silhouette / Face playing happily -->
      <circle cx="-35" cy="-25" r="16" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" />
      <path d="M -48 10 C -48 -10 -22 -10 -22 10 Z" fill="#3b82f6" />
      <!-- Block Tower -->
      <rect x="0" y="25" width="45" height="24" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
      <rect x="5" y="1" width="35" height="24" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
      <rect x="10" y="-23" width="25" height="24" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
      <polygon points="22,-45 8,-23 37,-23" fill="#10b981" stroke="#047857" stroke-width="1.5" /> <!-- Triangle Roof -->
      <text x="22" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#93c5fd" text-anchor="middle">CHILD A: BLOCKS</text>
    </g>

    <!-- Harmony Bridge Symbol in Center (No Sharing Pressure, Joyful Co-presence) -->
    <g transform="translate(0, -10)">
      <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#fde047" stroke-width="2" />
      <!-- Smile icon -->
      <circle cx="-8" cy="-5" r="2.5" fill="#fde047" />
      <circle cx="8" cy="-5" r="2.5" fill="#fde047" />
      <path d="M -10 6 Q 0 14 10 6" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
      <!-- Parallel track indicator -->
      <line x1="-15" y1="36" x2="15" y2="36" stroke="#2dd4bf" stroke-width="2.5" />
      <line x1="-15" y1="42" x2="15" y2="42" stroke="#2dd4bf" stroke-width="2.5" />
    </g>

    <!-- Toddler B Activity (Right): Wooden Train Track & Engine -->
    <g transform="translate(110, 0)">
      <!-- Toddler Silhouette -->
      <circle cx="35" cy="-25" r="16" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" />
      <path d="M 22 10 C 22 -10 48 -10 48 10 Z" fill="#ec4899" />
      <!-- Wooden Train Track Rails -->
      <path d="M -50 45 L 30 45" stroke="#78350f" stroke-width="4" />
      <path d="M -50 35 L 30 35" stroke="#78350f" stroke-width="4" />
      <!-- Sleepers / Ties -->
      <line x1="-40" y1="30" x2="-40" y2="50" stroke="#b45309" stroke-width="3" />
      <line x1="-20" y1="30" x2="-20" y2="50" stroke="#b45309" stroke-width="3" />
      <line x1="0" y1="30" x2="0" y2="50" stroke="#b45309" stroke-width="3" />
      <line x1="20" y1="30" x2="20" y2="50" stroke="#b45309" stroke-width="3" />
      <!-- Wooden Toy Train Engine -->
      <g transform="translate(-10, 15)">
        <rect x="-24" y="-15" width="38" height="22" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1" />
        <rect x="0" y="-24" width="14" height="12" rx="2" fill="#3b82f6" /> <!-- Cab -->
        <circle cx="-14" cy="9" r="6" fill="#1e293b" stroke="#fde047" stroke-width="1.5" /> <!-- Wheel 1 -->
        <circle cx="6" cy="9" r="6" fill="#1e293b" stroke="#fde047" stroke-width="1.5" /> <!-- Wheel 2 -->
      </g>
      <text x="-10" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fbcfe8" text-anchor="middle">CHILD B: TRAIN</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Parallel Play Harmony</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Playing Beside Peers · Social Stepping Stone · No Forced Sharing</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#2dd4bf" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#2dd4bf" />
    </g>
  </g>
</svg>
