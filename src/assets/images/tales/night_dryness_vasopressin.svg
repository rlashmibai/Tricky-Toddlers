<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#021d30" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Crescent moon and stars -->
  <path d="M 680 50 A 24 24 0 0 0 660 80 A 24 24 0 1 1 680 50 Z" fill="#fef08a" opacity="0.8" />
  <circle cx="200" cy="70" r="2.5" fill="#ffffff" opacity="0.6" />
  <circle cx="280" cy="110" r="2" fill="#bae6fd" opacity="0.7" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="180" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="180" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="2">POTTY TRAINING</text>
  </g>

  <!-- Central Thematic Illustration: The Science of Night Dryness (Vasopressin Hormone & Peaceful Night Bed) -->
  <g filter="url(#shadow)" transform="translate(400, 180)">
    <!-- Cozy Night Bed on Left -->
    <g transform="translate(-130, 20)">
      <rect x="-65" y="-30" width="130" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <rect x="-58" y="-42" width="40" height="20" rx="8" fill="#f8fafc" /> <!-- Pillow -->
      <path d="M -25 -25 Q 10 -40 55 -20 L 55 20 L -25 20 Z" fill="#0284c7" opacity="0.85" /> <!-- Cozy Duvet -->
      <text x="-5" y="-50" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#fef08a">z</text>
      <text x="10" y="-62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#fef08a">Z</text>
      <text x="30" y="-76" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#fef08a">Z</text>
    </g>

    <!-- Hormone Molecule Pathway in Center (ADH / Vasopressin) -->
    <g transform="translate(20, -20)">
      <circle cx="0" cy="0" r="42" fill="#0369a1" opacity="0.3" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
      <!-- Hormone hex ring -->
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#fef08a" />
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">VASOPRESSIN (ADH)</text>
      <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle">Deep Sleep Maturation</text>
    </g>

    <!-- Dry Bedtime Training Underpants / Pull-Up on Right -->
    <g transform="translate(160, 25)">
      <!-- Training Pants / Cotton Underwear Silhouette -->
      <path d="M -40 -25 L 40 -25 L 35 15 C 20 15 15 35 0 35 C -15 35 -20 15 -35 15 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Waistband -->
      <line x1="-38" y1="-18" x2="38" y2="-18" stroke="#0284c7" stroke-width="3" />
      <circle cx="0" cy="5" r="10" fill="#22c55e" />
      <path d="M -5 5 L -2 8 L 5 2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#4ade80" text-anchor="middle">100% DRY PROTOCOL</text>
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The Science of Night Dryness</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Vasopressin Hormone Maturation · Bedtime Pull-Ups Are Normal</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#38bdf8" />
    </g>
  </g>
</svg>
