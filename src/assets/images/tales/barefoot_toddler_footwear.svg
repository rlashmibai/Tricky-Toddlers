<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" /><line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" /><line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="480" /><line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" /><line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <circle cx="150" cy="120" r="160" fill="#34d399" opacity="0.12" filter="blur(40px)" />
  <circle cx="650" cy="340" r="180" fill="#34d399" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#34d399" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#34d399" letter-spacing="2">DEVELOPMENT</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="400" cy="175" r="95" fill="url(#sunGlow)" opacity="0.25" />
    <!-- Bare Little Toddler Feet Print (Left & Right) -->
    <g transform="translate(350, 160)">
      <ellipse cx="0" cy="20" rx="18" ry="32" fill="#facc15" />
      <circle cx="-12" cy="-22" r="6" fill="#facc15" />
      <circle cx="-4" cy="-25" r="5" fill="#facc15" />
      <circle cx="3" cy="-24" r="4.5" fill="#facc15" />
      <circle cx="9" cy="-22" r="4" fill="#facc15" />
      <circle cx="14" cy="-19" r="3.5" fill="#facc15" />
    </g>
    <g transform="translate(450, 160)">
      <ellipse cx="0" cy="20" rx="18" ry="32" fill="#facc15" />
      <circle cx="12" cy="-22" r="6" fill="#facc15" />
      <circle cx="4" cy="-25" r="5" fill="#facc15" />
      <circle cx="-3" cy="-24" r="4.5" fill="#facc15" />
      <circle cx="-9" cy="-22" r="4" fill="#facc15" />
      <circle cx="-14" cy="-19" r="3.5" fill="#facc15" />
    </g>
    <!-- Sensory Ground Texture Ripples & Flexibility Arc -->
    <path d="M 310 225 Q 400 245 490 225" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <circle cx="400" cy="105" r="22" fill="#10b981" />
    <path d="M 392 105 L 398 111 L 409 100" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">Toddler Footwear: When Barefoot is Best</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">Sensory Nerve Soles · Arch Strength · Natural Foot Mechanics</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#34d399" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#34d399" />
    </g>
  </g>
</svg>
