<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Moon and stars ambient backdrop -->
  <circle cx="680" cy="90" r="45" fill="#fef08a" opacity="0.15" filter="blur(20px)" />
  <path d="M 690 60 A 30 30 0 0 0 665 95 A 30 30 0 1 1 690 60 Z" fill="#fef08a" opacity="0.8" />
  <circle cx="210" cy="70" r="2.5" fill="#ffffff" opacity="0.6" />
  <circle cx="270" cy="110" r="3" fill="#fde047" opacity="0.7" />
  <circle cx="150" cy="140" r="2" fill="#ffffff" opacity="0.5" />
  <circle cx="580" cy="65" r="3.5" fill="#fde047" opacity="0.8" />

  <!-- Category Pill Badge -->
  <g transform="translate(48, 36)">
    <rect width="160" height="32" rx="16" fill="#000000" opacity="0.4" />
    <rect width="160" height="32" rx="16" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.7" />
    <circle cx="20" cy="16" r="5" fill="#fde047" />
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fde047" letter-spacing="2">SLEEP TIPS</text>
  </g>

  <!-- Visual Central Illustration: The Golden Bedtime Pass Ticket & Bedtime Elements -->
  <g filter="url(#shadow)" transform="translate(400, 175)">
    <!-- Cozy Bed with Pillow in Background -->
    <rect x="-190" y="20" width="380" height="60" rx="14" fill="#334155" opacity="0.9" />
    <rect x="-180" y="0" width="100" height="30" rx="12" fill="#f8fafc" opacity="0.9" />
    <!-- Golden Bedtime Pass Ticket Card -->
    <g transform="rotate(-6)">
      <rect x="-150" y="-85" width="300" height="130" rx="18" fill="url(#ticketGrad)" stroke="#fef08a" stroke-width="3" />
      <!-- Perforation notches on edges -->
      <circle cx="-150" cy="-20" r="14" fill="#1e1b4b" />
      <circle cx="150" cy="-20" r="14" fill="#1e1b4b" />
      <!-- Ticket Dashed Line -->
      <line x1="-50" y1="-85" x2="-50" y2="45" stroke="#78350f" stroke-width="2" stroke-dasharray="6 6" />
      <!-- Star Icon on Ticket Stub -->
      <circle cx="-100" cy="-20" r="24" fill="#78350f" opacity="0.25" />
      <polygon points="-100,-34 -94,-22 -82,-22 -92,-14 -88,-2 -100,-10 -112,-2 -108,-14 -118,-22 -106,-22" fill="#fef3c7" />
      <!-- Ticket Text -->
      <text x="50" y="-45" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#451a03" text-anchor="middle" letter-spacing="2">BEDTIME PASS</text>
      <text x="50" y="-18" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78350f" text-anchor="middle">VALID FOR 1 WATER CUP OR EXTRA HUG</text>
      <!-- Stamp Badge -->
      <rect x="0" y="2" width="100" height="26" rx="6" fill="#78350f" />
      <text x="50" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fef3c7" text-anchor="middle" letter-spacing="1">NO FRICTION</text>
    </g>
    <!-- Water Glass and Hug Hearts -->
    <g transform="translate(140, 20)">
      <rect x="0" y="-25" width="26" height="40" rx="5" fill="#38bdf8" opacity="0.75" stroke="#bae6fd" stroke-width="2" />
      <line x1="8" y1="-35" x2="16" y2="-5" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Frosted Card Banner with Title and Tagline -->
  <g transform="translate(48, 330)">
    <rect width="704" height="114" rx="24" fill="#090d16" opacity="0.88" />
    <rect width="704" height="114" rx="24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">The Bedtime Pass Routine</text>
    <text x="32" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="0.2">One Golden Ticket for Water or Hug · Zero Bedtime Friction</text>
    <g transform="translate(640, 48)">
      <circle cx="0" cy="0" r="18" fill="#fde047" opacity="0.15" />
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fde047" />
    </g>
  </g>
</svg>
