<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGradMeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="50%" stop-color="#171b36" />
      <stop offset="100%" stop-color="#091020" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="khichdiGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <filter id="softShadowMeal" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="720" rx="36" fill="url(#bgGradMeal)" stroke="#1e293b" stroke-width="2" />
  <circle cx="300" cy="310" r="210" fill="url(#amberGlow)" />

  <!-- Top Step Badge -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="136" height="34" rx="17" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#fbbf24" />
    <text x="34" y="22" font-size="13" font-weight="800" fill="#fde68a" letter-spacing="1.2">STEP 03</text>
  </g>

  <g transform="translate(410, 36)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-width="1.2" />
    <text x="75" y="22" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="0.6">PLATE &amp; BLW AI</text>
  </g>

  <!-- Smartphone Frame & Meal Plate Visual -->
  <g transform="translate(115, 95)" filter="url(#softShadowMeal)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="370" height="430" rx="38" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <rect x="12" y="12" width="346" height="406" rx="28" fill="#1e293b" />
    <rect x="135" y="20" width="100" height="14" rx="7" fill="#0f172a" />

    <!-- Divided Toddler Plate Illustration -->
    <g transform="translate(185, 175)">
      <!-- Outer Suction Plate -->
      <circle cx="0" cy="0" r="108" fill="#38bdf8" stroke="#0284c7" stroke-width="4" />
      <circle cx="0" cy="0" r="96" fill="#f8fafc" />

      <!-- Main Bowl: Warm Dal Khichdi with Veggies & Ghee -->
      <circle cx="-22" cy="-12" r="58" fill="#fffbeb" stroke="#e2e8f0" stroke-width="3" />
      <circle cx="-22" cy="-12" r="50" fill="url(#khichdiGrad)" />
      <!-- Carrot, Peas & Spinach Specks -->
      <circle cx="-38" cy="-24" r="6" fill="#16a34a" />
      <circle cx="-10" cy="-30" r="5" fill="#ea580c" />
      <circle cx="-25" cy="4" r="6" fill="#ea580c" />
      <circle cx="-4" cy="-6" r="5.5" fill="#16a34a" />
      <circle cx="-36" cy="10" r="4.5" fill="#15803d" />
      <ellipse cx="-20" cy="-14" rx="12" ry="7" fill="#fef08a" fill-opacity="0.7" />

      <!-- Side Compartment 1: Steamed Carrot & Broccoli Florets -->
      <circle cx="52" cy="-30" r="32" fill="#f0fdf4" stroke="#dcfce7" stroke-width="2" />
      <circle cx="44" cy="-36" r="11" fill="#22c55e" />
      <circle cx="62" cy="-24" r="10" fill="#16a34a" />
      <rect x="44" y="-18" width="18" height="8" rx="4" fill="#f97316" />

      <!-- Side Compartment 2: Curd / Dahi Bowl -->
      <circle cx="42" cy="42" r="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
      <circle cx="42" cy="42" r="23" fill="#ffffff" />
      <circle cx="42" cy="42" r="3" fill="#10b981" />
    </g>

    <!-- Floating AI Detection Callout Tags -->
    <!-- Tag 1: Dal Khichdi -->
    <g transform="translate(24, 58)">
      <rect x="0" y="0" width="166" height="34" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="16" cy="17" r="5" fill="#fbbf24" />
      <text x="28" y="15" font-size="11" font-weight="900" fill="#ffffff">Moong Dal Khichdi</text>
      <text x="28" y="28" font-size="9.5" font-weight="700" fill="#fde68a">215 kcal · Rich Iron &amp;Ghee</text>
    </g>

    <!-- Tag 2: Steamed Veggies -->
    <g transform="translate(202, 72)">
      <rect x="0" y="0" width="144" height="34" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="#34d399" stroke-width="1.5" />
      <circle cx="15" cy="17" r="5" fill="#34d399" />
      <text x="26" y="15" font-size="11" font-weight="900" fill="#ffffff">Soft BLW Veggies</text>
      <text x="26" y="28" font-size="9.5" font-weight="700" fill="#6ee7b7">Low Choking Risk ✓</text>
    </g>

    <!-- Macro Summary Panel Inside Screen -->
    <g transform="translate(30, 294)">
      <rect x="0" y="0" width="310" height="72" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="16" y="22" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="0.5">AI MEAL NUTRITION ESTIMATE (ICMR RDA)</text>

      <!-- 4 Mini Macro Pills -->
      <rect x="14" y="32" width="66" height="30" rx="8" fill="#1e293b" />
      <text x="47" y="45" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">Calories</text>
      <text x="47" y="58" font-size="11" font-weight="900" fill="#fbbf24" text-anchor="middle">285 kcal</text>

      <rect x="86" y="32" width="66" height="30" rx="8" fill="#1e293b" />
      <text x="119" y="45" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">Protein</text>
      <text x="119" y="58" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">9.4 g</text>

      <rect x="158" y="32" width="66" height="30" rx="8" fill="#1e293b" />
      <text x="191" y="45" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">Iron</text>
      <text x="191" y="58" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle">3.1 mg</text>

      <rect x="230" y="32" width="66" height="30" rx="8" fill="#065f46" />
      <text x="263" y="45" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Score</text>
      <text x="263" y="58" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">96 / 100</text>
    </g>

    <!-- Bottom Pill -->
    <rect x="48" y="376" width="274" height="30" rx="15" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="185" y="395" font-size="12" font-weight="800" fill="#fde68a" text-anchor="middle">🍲 Recognizes 500+ Indian Home Meals</text>
  </g>

  <!-- Bottom Text Description -->
  <g transform="translate(40, 560)">
    <text x="260" y="32" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">3. Scan Meal</text>
    <text x="260" y="66" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">Take a photo of any home-cooked plate or tiffin for</text>
    <text x="260" y="90" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle">real-time macros, iron absorption &amp; BLW texture tips.</text>
  </g>
</svg>
