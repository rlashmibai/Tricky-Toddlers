<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGradLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="50%" stop-color="#111d38" />
      <stop offset="100%" stop-color="#091020" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="pkgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="720" rx="36" fill="url(#bgGradLabel)" stroke="#1e293b" stroke-width="2" />
  <circle cx="300" cy="310" r="210" fill="url(#emeraldGlow)" />

  <!-- Top Step Badge -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="136" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <text x="34" y="22" font-size="13" font-weight="800" fill="#6ee7b7" letter-spacing="1.2">STEP 01</text>
  </g>

  <g transform="translate(430, 36)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2" />
    <text x="65" y="22" font-size="12" font-weight="800" fill="#fcd34d" text-anchor="middle" letter-spacing="0.6">AI OCR VISION</text>
  </g>

  <!-- Smartphone Frame & Nutrition Label Visual -->
  <g transform="translate(115, 95)" filter="url(#softShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="370" height="430" rx="38" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <rect x="12" y="12" width="346" height="406" rx="28" fill="#1e293b" />
    <!-- Phone Notch -->
    <rect x="135" y="20" width="100" height="14" rx="7" fill="#0f172a" />

    <!-- Nutrition Facts Package Inside Screen -->
    <g transform="translate(36, 50)">
      <rect x="0" y="0" width="298" height="310" rx="18" fill="url(#pkgGrad)" stroke="#f59e0b" stroke-width="2" />
      <!-- Header on Package -->
      <rect x="18" y="16" width="262" height="44" rx="8" fill="#1e293b" />
      <text x="30" y="37" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="0.5">NUTRITION FACTS &amp; INGREDIENTS</text>
      <text x="30" y="52" font-size="10" font-weight="600" fill="#94a3b8">Per 100g Serving · Infant Cereal Stage 2</text>

      <!-- Nutrition Rows -->
      <!-- Row 1: Energy -->
      <rect x="18" y="72" width="262" height="32" rx="6" fill="#ffffff" fill-opacity="0.85" />
      <text x="28" y="93" font-size="13" font-weight="700" fill="#0f172a">Energy / Calories</text>
      <text x="268" y="93" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end">382 kcal</text>

      <!-- Row 2: Added Sugars (Highlighted Alert) -->
      <rect x="14" y="112" width="270" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
      <text x="26" y="130" font-size="13" font-weight="900" fill="#991b1b">Added Sugar (Sucrose)</text>
      <text x="26" y="145" font-size="10" font-weight="700" fill="#dc2626">WHO Limit Exceeded for &lt;2 Yrs</text>
      <rect x="208" y="120" width="66" height="24" rx="6" fill="#ef4444" />
      <text x="241" y="136" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">14.5 g !</text>

      <!-- Row 3: Sodium -->
      <rect x="18" y="160" width="262" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="28" y="182" font-size="13" font-weight="800" fill="#92400e">Sodium (Salt)</text>
      <text x="268" y="182" font-size="13" font-weight="900" fill="#b45309" text-anchor="end">290 mg</text>

      <!-- Row 4: Protein & Iron -->
      <rect x="18" y="202" width="262" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="28" y="223" font-size="13" font-weight="800" fill="#065f46">Protein &amp; Iron Fortified</text>
      <text x="268" y="223" font-size="13" font-weight="900" fill="#047857" text-anchor="end">9.2 g ✓</text>

      <!-- Ingredients List Box -->
      <rect x="18" y="242" width="262" height="54" rx="8" fill="#ffffff" fill-opacity="0.92" />
      <text x="28" y="259" font-size="11" font-weight="900" fill="#334155">INGREDIENTS DETECTED:</text>
      <text x="28" y="274" font-size="10.5" font-weight="600" fill="#475569">Wheat Flour, Skim Milk Powder, Sucrose,</text>
      <text x="28" y="288" font-size="10.5" font-weight="700" fill="#dc2626">Maltodextrin, Palm Oil, INS 322 (Soy)</text>
    </g>

    <!-- Laser Scan Line & Glow -->
    <rect x="24" y="185" width="322" height="44" fill="url(#scanBeam)" />
    <line x1="24" y1="207" x2="346" y2="207" stroke="#34d399" stroke-width="3" />
    <circle cx="24" cy="207" r="5" fill="#6ee7b7" />
    <circle cx="346" cy="207" r="5" fill="#6ee7b7" />

    <!-- Corner Viewfinder Brackets -->
    <path d="M 28 70 L 28 44 L 54 44" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <path d="M 342 70 L 342 44 L 316 44" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <path d="M 28 342 L 28 368 L 54 368" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <path d="M 342 342 L 342 368 L 316 368" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

    <!-- Bottom Pill Inside Phone -->
    <rect x="48" y="374" width="274" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="185" y="395" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="middle">✓ 18 Ingredients &amp; Additives Decoded</text>
  </g>

  <!-- Bottom Text Description -->
  <g transform="translate(40, 560)">
    <text x="260" y="32" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">1. Scan Label</text>
    <text x="260" y="66" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">Snap any nutrition table or ingredient list to uncover</text>
    <text x="260" y="90" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle">hidden sugars, sodium, E-numbers &amp; allergens.</text>
  </g>
</svg>
