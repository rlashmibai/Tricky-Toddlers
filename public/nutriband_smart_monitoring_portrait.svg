<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 1000" width="640" height="1000" style="background-color:#FAF8F5; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF9" />
      <stop offset="60%" stop-color="#F8F5F0" />
      <stop offset="100%" stop-color="#F1EDE7" />
    </linearGradient>

    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F8FF" />
    </linearGradient>

    <radialGradient id="ledGlow2" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </radialGradient>

    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow2" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.06" />
    </filter>

    <clipPath id="growthClip">
      <rect x="35" y="150" width="570" height="175" rx="20" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="1000" fill="url(#bgGrad2)" rx="28" />

  <!-- Subtle Blueprint Tech Circles -->
  <g opacity="0.15">
    <circle cx="320" cy="240" r="160" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="320" cy="240" r="210" fill="none" stroke="#BAE6FD" stroke-width="1" stroke-dasharray="6,6" />
  </g>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(35, 42)">
    <rect x="0" y="0" width="215" height="28" rx="14" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#0284C7" />
    <text x="26" y="19" font-size="11.5" font-weight="800" fill="#0369A1" letter-spacing="0.4">INFANCY TO AGE 8 · CONNECTED</text>

    <text x="0" y="64" font-size="32" font-weight="900" fill="#0A192F" letter-spacing="-0.8">Smart Monitoring</text>
    <text x="0" y="92" font-size="24" font-weight="800" fill="#0284C7">for Every Stage</text>

    <text x="0" y="116" font-size="12.5" font-weight="600" fill="#475569">
      One sensor. Two ways to wear. <tspan fill="#0284C7" font-weight="800">Six signals.</tspan> Lifelong peace of mind.
    </text>
  </g>

  <!-- ================= CENTRAL CHILD-GROWTH &amp; 2 WAYS TO WEAR ================= -->
  <g transform="translate(35, 170)">
    <!-- Card Container -->
    <rect x="0" y="0" width="570" height="195" rx="22" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#cardShadow2)" />

    <!-- Growth Banner Top -->
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="140" height="24" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
      <text x="70" y="16" font-size="11" font-weight="800" fill="#0284C7" text-anchor="middle">GROWTH: 1 TO 8 YEARS</text>
    </g>

    <!-- Visual 3 Stages: Baby, Toddler, School Child Icons / Graphic -->
    <g transform="translate(20, 52)">
      <!-- 0-12m Baby Stage -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="80" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="32" cy="32" r="18" fill="#E0F2FE" />
        <!-- Baby Icon -->
        <circle cx="32" cy="28" r="8" fill="#0284C7" />
        <path d="M24,44 C24,38 40,38 40,44" fill="#0284C7" />
        <text x="60" y="28" font-size="12" font-weight="800" fill="#0A192F">0-12 Months</text>
        <text x="60" y="44" font-size="10.5" font-weight="600" fill="#64748B">Diaper Clip Mode</text>
        <rect x="10" y="58" width="145" height="16" rx="8" fill="#E0F2FE" />
        <text x="82" y="70" font-size="9" font-weight="800" fill="#0369A1" text-anchor="middle">WAY 1 · WAISTBAND FIT</text>
      </g>

      <!-- Connecting Arrow -->
      <path d="M172,40 L188,40" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="188,37 195,40 188,43" fill="#0284C7" />

      <!-- 1-3y Toddler Stage -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="165" height="80" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1" />
        <circle cx="32" cy="32" r="18" fill="#FCE7F3" />
        <!-- Toddler Icon -->
        <circle cx="32" cy="26" r="9" fill="#DB2777" />
        <path d="M22,44 C22,38 42,38 42,44" fill="#DB2777" />
        <text x="60" y="28" font-size="12" font-weight="800" fill="#0A192F">1-3 Years</text>
        <text x="60" y="44" font-size="10.5" font-weight="600" fill="#64748B">Cotton Strap (XS)</text>
        <rect x="10" y="58" width="145" height="16" rx="8" fill="#FCE7F3" />
        <text x="82" y="70" font-size="9" font-weight="800" fill="#BE185D" text-anchor="middle">WAY 2 · FIRST STEPS</text>
      </g>

      <!-- Connecting Arrow -->
      <path d="M372,40 L388,40" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="388,37 395,40 388,43" fill="#0284C7" />

      <!-- 3-8y School Child Stage -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="130" height="80" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
        <circle cx="28" cy="32" r="18" fill="#DCFCE7" />
        <!-- Child with backpack icon -->
        <circle cx="28" cy="25" r="8" fill="#16A34A" />
        <path d="M19,44 C19,37 37,37 37,44" fill="#16A34A" />
        <text x="54" y="28" font-size="12" font-weight="800" fill="#0A192F">3-8 Years</text>
        <text x="54" y="44" font-size="10" font-weight="600" fill="#64748B">Cotton (M/L)</text>
        <rect x="8" y="58" width="114" height="16" rx="8" fill="#DCFCE7" />
        <text x="65" y="70" font-size="9" font-weight="800" fill="#15803D" text-anchor="middle">WAY 2 · ACTIVE</text>
      </g>
    </g>

    <!-- Product Display: 1 Sensor -> 2 Ways to Wear (Diaper Clip &amp; Cotton Strap) -->
    <g transform="translate(20, 144)">
      <rect x="0" y="0" width="530" height="40" rx="12" fill="#F0F8FF" stroke="#BAE6FD" stroke-width="1" />
      
      <!-- Label Left: Diaper Clip 0-12m -->
      <g transform="translate(15, 8)">
        <circle cx="12" cy="12" r="10" fill="#0284C7" />
        <path d="M9,12 L11,15 L16,9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        <text x="28" y="11" font-size="11" font-weight="800" fill="#0A192F">Way 1: Diaper Clip</text>
        <text x="28" y="23" font-size="10" font-weight="600" fill="#0284C7">0-12 Months · Gentle Waistband</text>
      </g>

      <!-- Center Pod Indicator -->
      <g transform="translate(250, 8)">
        <rect x="0" y="0" width="95" height="24" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2" />
        <circle cx="14" cy="12" r="3.5" fill="#22C55E" filter="url(#glow2)" />
        <text x="24" y="16" font-size="10" font-weight="800" fill="#0A192F">1 SENSOR POD</text>
      </g>

      <!-- Label Right: Cotton Strap 1-8y -->
      <g transform="translate(365, 8)">
        <circle cx="12" cy="12" r="10" fill="#DB2777" />
        <path d="M9,12 L11,15 L16,9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
        <text x="28" y="11" font-size="11" font-weight="800" fill="#0A192F">Way 2: Cotton Strap</text>
        <text x="28" y="23" font-size="10" font-weight="600" fill="#DB2777">1-8 Years · 3 Woven Sizes</text>
      </g>
    </g>
  </g>

  <!-- ================= SIX MONITORING SIGNALS (3 LEFT, 3 RIGHT) ================= -->
  <g transform="translate(35, 385)">
    <rect x="0" y="0" width="570" height="450" rx="24" fill="url(#panelGrad2)" stroke="#BAE6FD" stroke-width="1.5" filter="url(#cardShadow2)" />

    <!-- Section Title -->
    <g transform="translate(25, 24)">
      <div style="display:flex;">
        <text x="0" y="0" font-size="18" font-weight="900" fill="#0A192F">Six Continuous Monitoring Signals</text>
      </div>
      <text x="0" y="18" font-size="11.5" font-weight="500" fill="#64748B">Pediatric-grade algorithms calibrated for infant &amp; childhood baselines</text>
      <line x1="0" y1="28" x2="520" y2="28" stroke="#E2E8F0" stroke-width="1.2" />
    </g>

    <!-- LEFT COLUMN: 3 FEATURES -->
    <!-- Signal 1: Body Temperature (Soft Pink Circle) -->
    <g transform="translate(25, 68)">
      <rect x="0" y="0" width="250" height="105" rx="16" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="1.2" />
      <circle cx="32" cy="32" r="18" fill="#FCE7F3" />
      <!-- Thermometer icon -->
      <path d="M32,20 L32,34 M29,34 A4,4 0 1,0 35,34 A4,4 0 1,0 29,34" fill="#DB2777" stroke="#DB2777" stroke-width="1.5" />
      <text x="60" y="28" font-size="13.5" font-weight="800" fill="#0A192F">Body Temperature</text>
      <text x="60" y="46" font-size="10" font-weight="500" fill="#475569">
        Continuous skin-temperature tracking
      </text>
      <text x="60" y="59" font-size="10" font-weight="500" fill="#475569">
        with fever-range alerts calibrated
      </text>
      <text x="60" y="72" font-size="10" font-weight="500" fill="#475569">
        for toddler baselines.
      </text>
      <rect x="15" y="82" width="75" height="16" rx="8" fill="#FDF2F8" />
      <text x="52" y="94" font-size="9" font-weight="800" fill="#DB2777" text-anchor="middle">FEVER RADAR</text>
    </g>

    <!-- Signal 2: Activity (Soft Green Circle) -->
    <g transform="translate(25, 185)">
      <rect x="0" y="0" width="250" height="105" rx="16" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.2" />
      <circle cx="32" cy="32" r="18" fill="#DCFCE7" />
      <!-- Running child icon -->
      <circle cx="32" cy="22" r="4" fill="#16A34A" />
      <path d="M26,30 L32,27 L38,32 M32,27 L30,37 L24,42 M32,32 L36,42" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" />
      <text x="60" y="28" font-size="13.5" font-weight="800" fill="#0A192F">Activity</text>
      <text x="60" y="46" font-size="10" font-weight="500" fill="#475569">
        Tracks active &amp; sedentary time,
      </text>
      <text x="60" y="59" font-size="10" font-weight="500" fill="#475569">
        highlighting unusual changes
      </text>
      <text x="60" y="72" font-size="10" font-weight="500" fill="#475569">
        in daily activity patterns.
      </text>
      <rect x="15" y="82" width="75" height="16" rx="8" fill="#F0FDF4" />
      <text x="52" y="94" font-size="9" font-weight="800" fill="#16A34A" text-anchor="middle">ACTIVE PLAY</text>
    </g>

    <!-- Signal 3: Sleep (Soft Lavender Circle) -->
    <g transform="translate(25, 302)">
      <rect x="0" y="0" width="250" height="105" rx="16" fill="#FFFFFF" stroke="#F3E8FF" stroke-width="1.2" />
      <circle cx="32" cy="32" r="18" fill="#F3E8FF" />
      <!-- Crescent moon &amp; star icon -->
      <path d="M35,22 C31,23 27,27 27,33 C27,39 32,43 37,42 C33,40 31,36 32,31 C33,26 36,23 35,22 Z" fill="#9333EA" />
      <circle cx="38" cy="24" r="1.5" fill="#9333EA" />
      <text x="60" y="28" font-size="13.5" font-weight="800" fill="#0A192F">Sleep</text>
      <text x="60" y="46" font-size="10" font-weight="500" fill="#475569">
        Monitors sleep duration, restlessness,
      </text>
      <text x="60" y="59" font-size="10" font-weight="500" fill="#475569">
        and wake events against age-
      </text>
      <text x="60" y="72" font-size="10" font-weight="500" fill="#475569">
        appropriate pediatric guidelines.
      </text>
      <rect x="15" y="82" width="75" height="16" rx="8" fill="#FAF5FF" />
      <text x="52" y="94" font-size="9" font-weight="800" fill="#9333EA" text-anchor="middle">CRIB SLEEP</text>
    </g>

    <!-- RIGHT COLUMN: 3 FEATURES -->
    <!-- Signal 4: Movement (Soft Blue Circle) -->
    <g transform="translate(295, 68)">
      <rect x="0" y="0" width="250" height="105" rx="16" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.2" />
      <circle cx="32" cy="32" r="18" fill="#E0F2FE" />
      <!-- Running person icon -->
      <circle cx="32" cy="22" r="4" fill="#0284C7" />
      <path d="M28,29 L32,27 L36,31 M32,27 L31,36 L26,42 M32,32 L35,41" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
      <text x="60" y="28" font-size="13.5" font-weight="800" fill="#0A192F">Movement</text>
      <text x="60" y="46" font-size="10" font-weight="500" fill="#475569">
        Tracks movement patterns, falls,
      </text>
      <text x="60" y="59" font-size="10" font-weight="500" fill="#475569">
        and prolonged stillness for
      </text>
      <text x="60" y="72" font-size="10" font-weight="500" fill="#475569">
        activity and safety insights.
      </text>
      <rect x="15" y="82" width="75" height="16" rx="8" fill="#F0F9FF" />
      <text x="52" y="94" font-size="9" font-weight="800" fill="#0284C7" text-anchor="middle">FALL ALERT</text>
    </g>

    <!-- Signal 5: Nutrients Detection (Soft Yellow Circle) -->
    <g transform="translate(295, 185)">
      <rect x="0" y="0" width="250" height="105" rx="16" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.2" />
      <circle cx="32" cy="32" r="18" fill="#FEF3C7" />
      <!-- Apple icon -->
      <path d="M32,23 C29,20 24,24 26,31 C28,37 32,41 32,41 C32,41 36,37 38,31 C40,24 35,20 32,23 Z" fill="#D97706" />
      <path d="M32,22 C33,18 36,18 36,18" fill="none" stroke="#15803D" stroke-width="1.5" />
      <text x="60" y="28" font-size="13.5" font-weight="800" fill="#0A192F">Nutrients Detection</text>
      <text x="60" y="46" font-size="10" font-weight="500" fill="#475569">
        Connects food-intake records with
      </text>
      <text x="60" y="59" font-size="10" font-weight="500" fill="#475569">
        nutrition &amp; hydration insights aligned
      </text>
      <text x="60" y="72" font-size="10" font-weight="500" fill="#475569">
        with age-based dietary benchmarks.
      </text>
      <rect x="15" y="82" width="85" height="16" rx="8" fill="#FFFBEB" />
      <text x="57" y="94" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle">DIETARY SYNC</text>
    </g>

    <!-- Signal 6: GPS Location (Soft Turquoise Circle) -->
    <g transform="translate(295, 302)">
      <rect x="0" y="0" width="250" height="105" rx="16" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="1.2" />
      <circle cx="32" cy="32" r="18" fill="#CCFBF1" />
      <!-- Map pin icon -->
      <path d="M32,19 C28,19 25,22 25,26 C25,32 32,41 32,41 C32,41 39,32 39,26 C39,22 36,19 32,19 Z" fill="#0D9488" />
      <circle cx="32" cy="25" r="2.5" fill="#FFFFFF" />
      <text x="60" y="28" font-size="13.5" font-weight="800" fill="#0A192F">GPS Location</text>
      <text x="60" y="46" font-size="10" font-weight="500" fill="#475569">
        Location tracking and configurable
      </text>
      <text x="60" y="59" font-size="10" font-weight="500" fill="#475569">
        safe-zone alerts for outings,
      </text>
      <text x="60" y="72" font-size="10" font-weight="500" fill="#475569">
        home, and preschool childcare.
      </text>
      <rect x="15" y="82" width="75" height="16" rx="8" fill="#F0FDFA" />
      <text x="52" y="94" font-size="9" font-weight="800" fill="#0D9488" text-anchor="middle">SAFE ZONES</text>
    </g>
  </g>

  <!-- ================= 5 BOTTOM FEATURES BANNER ================= -->
  <g transform="translate(35, 855)">
    <rect x="0" y="0" width="570" height="110" rx="20" fill="#F0F8FF" stroke="#BAE6FD" stroke-width="1.5" filter="url(#cardShadow2)" />

    <!-- 5 Evenly Spaced Columns -->
    <!-- Col 1: Sync with Smartphone -->
    <g transform="translate(15, 18)">
      <rect x="0" y="0" width="98" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1" />
      <rect x="41" y="10" width="16" height="24" rx="3" fill="none" stroke="#0284C7" stroke-width="1.8" />
      <circle cx="49" cy="28" r="1.2" fill="#0284C7" />
      <text x="49" y="46" font-size="9.5" font-weight="800" fill="#0A192F" text-anchor="middle">Sync Mobile</text>
      <text x="49" y="58" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">Phone alerts</text>
    </g>

    <!-- Col 2: Cloud Connected -->
    <g transform="translate(123, 18)">
      <rect x="0" y="0" width="98" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1" />
      <path d="M41,24 C39,24 37,26 37,28 C35,28 34,29 34,31 C34,33 35,34 37,34 L59,34 C61,34 62,33 62,31 C62,29 61,28 59,28 C59,25 56,22 53,22 C50,22 48,23 47,25 C46,24 43,24 41,24 Z" fill="none" stroke="#0284C7" stroke-width="1.8" />
      <text x="49" y="46" font-size="9.5" font-weight="800" fill="#0A192F" text-anchor="middle">Cloud Access</text>
      <text x="49" y="58" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">Connected data</text>
    </g>

    <!-- Col 3: Safe &amp; Comfortable -->
    <g transform="translate(231, 18)">
      <rect x="0" y="0" width="108" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1" />
      <path d="M47,12 L54,15 L61,12 C61,20 54,26 54,26 C54,26 47,20 47,12 Z" fill="none" stroke="#0284C7" stroke-width="1.8" />
      <text x="54" y="46" font-size="9.5" font-weight="800" fill="#0A192F" text-anchor="middle">Safe &amp; Soft</text>
      <text x="54" y="58" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">Lightweight wear</text>
    </g>

    <!-- Col 4: Long Battery Life -->
    <g transform="translate(349, 18)">
      <rect x="0" y="0" width="98" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1" />
      <rect x="40" y="14" width="18" height="14" rx="2.5" fill="none" stroke="#0284C7" stroke-width="1.8" />
      <line x1="59" y1="18" x2="59" y2="24" stroke="#0284C7" stroke-width="2" />
      <text x="49" y="46" font-size="9.5" font-weight="800" fill="#0A192F" text-anchor="middle">Long Battery</text>
      <text x="49" y="58" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">Easy recharge</text>
    </g>

    <!-- Col 5: 5-Year Warranty -->
    <g transform="translate(457, 18)">
      <rect x="0" y="0" width="98" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1" />
      <circle cx="49" cy="20" r="10" fill="none" stroke="#0284C7" stroke-width="1.8" />
      <text x="49" y="24" font-size="8.5" font-weight="900" fill="#0284C7" text-anchor="middle">5Y</text>
      <text x="49" y="46" font-size="9.5" font-weight="800" fill="#0A192F" text-anchor="middle">5Y Warranty</text>
      <text x="49" y="58" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">Family support</text>
    </g>
  </g>
</svg>